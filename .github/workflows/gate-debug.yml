name: Gate Debug

# Diagnostic for the quality gate's all-features test step. Push a `debug-*`
# tag at any commit to run it. Publishes nothing.
#
# Bisected so far: the runner dies (no log survives for the job) whenever
# cmv's tests run a second time on the same machine — `cargo test` twice, or
# the default run followed by the all-features one. Every other crate's tests
# pass a second run. The death is instant and ignores memory/task caps, which
# looks like something signalling every process the runner user owns.
#
# So after a normal first pass, this runs each cmv test binary again as a
# separate unprivileged user under a root-owned strace that records every
# kill/execve. If a test signals everything its user owns, only that user's
# processes die; the runner and strace survive, and the trace names the call.

on:
  push:
    tags: ["debug-*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  cmv-second-pass:
    name: cmv second pass under strace
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: quality-gate
          save-if: false

      - name: First pass (default features)
        run: timeout 900 cargo test

      - name: Prepare an unprivileged user and strace
        run: |
          sudo apt-get install -y -qq strace >/dev/null
          sudo useradd -m tester
          chmod -R a+rwX "$GITHUB_WORKSPACE"
          chmod a+x "$HOME" "$(dirname "$GITHUB_WORKSPACE")" "$(dirname "$(dirname "$GITHUB_WORKSPACE")")"
          ps -eo pid,user,pgid,etime,command --forest | grep -vE 'Runner\.|node ' | tail -30

      - name: Second pass of each cmv test binary, as tester, traced
        run: |
          set +e
          cargo test -p cmv --no-run --message-format=json 2>/dev/null \
            | jq -r 'select(.profile.test == true and .executable != null) | .executable' > bins.txt
          cat bins.txt
          cd cmv
          while read -r bin; do
            name=$(basename "$bin")
            echo "=================== $name"
            sudo strace -f -qq -e trace=kill,tkill,tgkill,execve -e signal=none \
              -o "/tmp/trace-$name.txt" -u tester \
              env HOME=/home/tester PATH="/usr/local/bin:/usr/bin:/bin" \
              timeout --kill-after=5 120 "$bin" --test-threads=1 2>&1 | tail -15
            echo "--- exit ${PIPESTATUS[0]}; kill-family calls:"
            grep -E 'kill\(' "/tmp/trace-$name.txt" | head -20
            echo "--- execs:"
            grep -oE 'execve\("[^"]+", \[[^]]{0,160}' "/tmp/trace-$name.txt" | sort | uniq -c | sort -rn | head -15
          done < bins.txt
          echo "=================== runner-user processes still alive"
          ps -eo pid,user,pgid,etime,command --forest | grep -vE 'node ' | tail -30
