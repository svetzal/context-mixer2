name: Gate Debug

# Diagnostic twin of the quality gate's all-features test step. Push a
# `debug-*` tag at any commit to run it. Publishes nothing.
#
# When that step hangs, the hosted runner stops responding and GitHub keeps no
# log for the whole job — not even for the steps that passed — so a single job
# can't say what hung. This splits the all-features test run into one job per
# test target: the jobs that finish keep their logs, and the one that dies
# names the culprit. Output streams straight to the log (never through `tail`,
# which holds everything back until EOF), tests run single-threaded, and a
# heartbeat prints memory and process counts every 30s so a runaway shows in
# the log before the runner goes.

on:
  push:
    tags: ["debug-*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  all-features-tests:
    name: ${{ matrix.target.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: "cmx lib", args: "-p cmx --lib" }
          - { name: "cmx bin", args: "-p cmx --bins" }
          - { name: "cmx integration tests", args: "-p cmx --test '*'" }
          - { name: "cmx-core", args: "-p cmx-core --lib --bins --tests" }
          - { name: "cmf", args: "-p cmf --lib --bins --tests" }
          - { name: "cmv", args: "-p cmv --lib --bins --tests" }
          - { name: "intent-atlas", args: "-p intent-atlas --lib --tests" }
          - { name: "doctests", args: "--doc" }
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: quality-gate
          save-if: false

      - name: Environment
        run: |
          echo "ref=$GITHUB_REF type=$GITHUB_REF_TYPE"
          nproc; free -m; df -h / | tail -1
          env | grep -iE 'proxy|openai|ollama' || true

      - name: Build (all features)
        run: timeout 900 cargo test --all-features --no-run

      - name: Run (all features, single-threaded, watchdog)
        env:
          RUST_BACKTRACE: 1
        run: |
          set +e
          ( while sleep 30; do echo "--- heartbeat $(date -u +%T): $(free -m | awk '/Mem:/{print $3"MB used"}'), $(ps -e --no-headers | wc -l) procs"; done ) &
          hb=$!
          timeout --kill-after=10 480 cargo test --all-features ${{ matrix.target.args }} -- --test-threads=1
          code=$?
          kill $hb
          if [ "$code" = "124" ] || [ "$code" = "137" ]; then
            echo "=== TIMED OUT after 480s; processes still alive:"
            ps -eo pid,ppid,pgid,etime,stat,command --forest | grep -vE 'Runner|node' | tail -40
          fi
          exit $code
