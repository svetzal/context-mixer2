name: Gate Debug

# Diagnostic twin of the quality gate's all-features test step. Push a
# `debug-*` tag at any commit to run it. Publishes nothing.
#
# The all-features test run passes on a fresh runner, one target at a time or
# the whole workspace at once, but takes the runner down (no log survives for
# the job) when it follows the gate's earlier steps. These variants run it
# after different subsets of those steps, record what the earlier steps left
# behind (processes, files under $HOME and /tmp), and watch free disk, free
# memory, and the process count during the run, killing it (after recording
# what was growing) before a runaway takes the machine down with its log.

on:
  push:
    tags: ["debug-*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  all-features-tests:
    name: ${{ matrix.variant.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        variant:
          - { name: "default tests, then cmx lib", default_tests: true, clippy: false, args: "--all-features -p cmx --lib" }
          - { name: "default tests, then cmx bin", default_tests: true, clippy: false, args: "--all-features -p cmx --bins" }
          - { name: "default tests, then cmx integration tests", default_tests: true, clippy: false, args: "--all-features -p cmx --test '*'" }
          - { name: "default tests, then cmx-core", default_tests: true, clippy: false, args: "--all-features -p cmx-core --lib --bins --tests" }
          - { name: "default tests, then cmf", default_tests: true, clippy: false, args: "--all-features -p cmf --lib --bins --tests" }
          - { name: "default tests, then cmv", default_tests: true, clippy: false, args: "--all-features -p cmv --lib --bins --tests" }
          - { name: "default tests, then intent-atlas and doctests", default_tests: true, clippy: false, args: "--all-features -p intent-atlas" }
          - { name: "default tests twice", default_tests: true, clippy: false, args: "" }
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: quality-gate
          save-if: false

      - name: Environment
        run: |
          nproc; free -m; df -h / | tail -1
          touch "$RUNNER_TEMP/marker"
          ps -e --no-headers | wc -l

      - name: Clippy (default features)
        if: matrix.variant.clippy
        run: timeout 900 cargo clippy --all-targets -- -D warnings

      - name: Tests (default features)
        if: matrix.variant.default_tests
        run: timeout 900 cargo test

      - name: Clippy (all features)
        if: matrix.variant.clippy
        run: timeout 900 cargo clippy --all-targets --all-features -- -D warnings

      - name: What the earlier steps left behind
        run: |
          echo "=== processes (excluding runner plumbing)"
          ps -eo pid,ppid,pgid,etime,stat,rss,command --forest | grep -vE 'Runner\.|node |ps -eo|grep ' | tail -60
          echo "=== files under \$HOME newer than the job start (excluding caches)"
          find "$HOME" -newer "$RUNNER_TEMP/marker" -not -path "*/.cargo/*" -not -path "*/.rustup/*" -not -path "*/work/*" 2>/dev/null | head -60
          echo "=== /tmp"
          ls -la /tmp | head -40
          free -m; df -h / | tail -1

      - name: Build (all features)
        run: timeout 900 cargo test --all-features --no-run

      - name: Run (resource watchdog)
        env:
          RUST_BACKTRACE: 1
        run: |
          set +e
          # Not time-bounded alone: a watchdog kills the run as soon as free
          # disk, free memory, or the process count crosses a line, after
          # recording what was growing, so the runner survives to upload this log.
          setsid timeout --kill-after=10 600 cargo test ${{ matrix.variant.args }} &
          pid=$!
          while kill -0 $pid 2>/dev/null; do
            sleep 10
            disk=$(df --output=avail -m / | tail -1 | tr -d ' ')
            mem=$(free -m | awk '/Mem:/{print $7}')
            procs=$(ps -e --no-headers | wc -l)
            echo "--- $(date -u +%T) disk_free=${disk}MB mem_avail=${mem}MB procs=$procs"
            if [ "$disk" -lt 4000 ] || [ "$mem" -lt 2000 ] || [ "$procs" -gt 1500 ]; then
              echo "=== THRESHOLD CROSSED"
              ps -eo pid,ppid,pgid,etime,stat,rss,command --forest | grep -vE 'Runner\.|node ' | tail -60
              ps -eo comm --no-headers | sort | uniq -c | sort -rn | head -10
              sudo du -xm --max-depth=3 / 2>/dev/null | sort -rn | head -25
              sudo lsof -nP +L1 2>/dev/null | head -10
              kill -KILL -- -$pid 2>/dev/null
              break
            fi
          done
          wait $pid
          code=$?
          echo "=== exit $code; processes still alive:"
          ps -eo pid,ppid,pgid,etime,stat,rss,command --forest | grep -vE 'Runner\.|node |ps -eo|grep ' | tail -40
          df -h / | tail -1
          exit $code
