[package]
name = "cmv"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false
description = "Deterministic verifier for intents compiled by cmf"

[dependencies]
cmx-core = { path = "../cmx-core" }
cmf = { path = "../cmf" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[dev-dependencies]
cmx-core = { path = "../cmx-core", features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true
