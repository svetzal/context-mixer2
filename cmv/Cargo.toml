[package]
name = "cmv"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false
description = "Deterministic verifier for intents compiled by cmf"

[dependencies]
cmx-core = { path = "../cmx-core" }
intent-atlas = { path = "../intent-atlas" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# Signals a timed-out validator's process group through the kill(2) syscall
# (safe API; no `unsafe` in cmv) instead of shelling out to kill(1).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["process"] }

[dev-dependencies]
cmx-core = { path = "../cmx-core", features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true
