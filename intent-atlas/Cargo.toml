[package]
name = "intent-atlas"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
# Not published until a second consumer appears (see CMV.md, "The
# `intent-atlas` crate"); cmf and cmv depend on it by path.
publish = false
description = "The shared reader of the intent atlas: catalog, profiles, selection, sensors, and the compile manifest"

[lib]
name = "intent_atlas"

[dependencies]
cmx-core = { path = "../cmx-core" }
anyhow = "1"
glob = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[dev-dependencies]
chrono = "0.4.45"
cmx-core = { path = "../cmx-core", features = ["test-support"] }

[lints]
workspace = true
