[examples.ruby]
good = '''
Quantity = Data.define(:value) do
  def self.parse(raw:)
    n = Integer(raw, exception: false)
    unless n&.between?(1, 99)
      raise InvalidInput, "qty must be 1-99"
    end
    new(value: n)
  end
end

# boundary: parse once, pass the narrowed value inward
def create
  qty = Quantity.parse(raw: params[:qty])
  Cart.add(sku: params[:sku], qty: qty)
end
'''
