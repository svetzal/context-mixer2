[examples.clojure]
good = '''
(def transfer-params
  [:map
   [:to-account [:re #"\d{8}"]]
   [:amount [:and pos-int? [:< 1000000]]]])

(defn handler [req]
  (let [params (decode-body req)]
    (if (mc/validate transfer-params params)
      ; only narrowed, known-shape values travel inward
      {:status 200 :body (transfer! params)}
      {:status 400
       :body (mc/explain transfer-params params)})))
'''
bad = '''
(defn handler [req]
  ; raw decoded JSON flows straight into the core
  (let [params (json/read-str (slurp (:body req))
                              :key-fn keyword)]
    {:status 200 :body (transfer! params)}))

;; now reachable:
;; (transfer! {:amount "-9999" :to-account "'; drop table--"})
; core code must defend against shapes it was never meant
; to see — or, worse, doesn't
'''

[examples.cpp]
good = '''
// Boundary: parse once, reject explicitly, narrow the type.
std::expected<TransferOrder, ValidationError>
parseTransfer(const QJsonObject& body) {
  auto amount = Money::parse(body["amount"].toString());
  auto to = AccountId::parse(body["to"].toString());
  if (!amount || amount->isNegative())
    return std::unexpected(ValidationError::BadAmount);
  if (!to)
    return std::unexpected(ValidationError::BadAccount);
  return TransferOrder{*to, *amount};
}
// the core only ever receives TransferOrder — known-valid
'''
bad = '''
void handleTransfer(const QJsonObject& body) {
  // raw request strings flow straight into the core:
  ledger.transfer(body["to"].toString(),
                  body["amount"].toString().toDouble());
}
// Deep inside Ledger::transfer, months later: negative
// amounts, "", and "1e308" have all arrived here. Each
// callee now re-checks (differently) or trusts blindly.
'''

