[examples.go]
good = '''
// parse once at the edge; the core only ever sees Transfer
func parseTransfer(r *http.Request) (Transfer, error) {
	var raw struct{ Amount, To string }
	if err := json.NewDecoder(r.Body).Decode(&raw); err != nil {
		return Transfer{}, fmt.Errorf("decode transfer: %w", err)
	}
	amt, err := ParseMoney(raw.Amount) // rejects negatives, junk
	if err != nil {
		return Transfer{}, fmt.Errorf("amount: %w", err)
	}
	to, err := ParseAccountID(raw.To)
	if err != nil {
		return Transfer{}, fmt.Errorf("to: %w", err)
	}
	return Transfer{Amount: amt, To: to}, nil
}
'''
bad = '''
func handleTransfer(w http.ResponseWriter, r *http.Request) {
	var body map[string]any
	json.NewDecoder(r.Body).Decode(&body) // error ignored

	// raw wire values trusted straight into the core:
	// negative amounts, "", and missing keys all flow inward
	amt := body["amount"].(float64)
	svc.Transfer(r.Context(), body["to"].(string),
		int64(amt*100))
}
'''

[examples.java]
good = '''
// parsed once at the edge into a constrained domain value
record TransferRequest(AccountId from, AccountId to,
                       Money amount) {
    static TransferRequest parse(JsonNode body) {
        var amount = Money.parse(
            body.path("amount").asText());
        if (amount.isNegativeOrZero()) {
            throw new BadRequest("amount must be positive");
        }
        return new TransferRequest(
            AccountId.parse(body.path("from").asText()),
            AccountId.parse(body.path("to").asText()),
            amount);
    }
}
// core methods accept TransferRequest, never raw JSON
'''
bad = '''
void handleTransfer(HttpServletRequest req) {
    // raw request values flow straight into the core
    var from = req.getParameter("from");
    var amount = req.getParameter("amount");

    ledger.move(from, req.getParameter("to"),
        new BigDecimal(amount)); // "-500", "1e999", null...

    audit.log("transfer " + from);  // log injection, too
}
'''

[examples.kotlin]
good = '''
fun parseTransfer(raw: JsonObject): TransferRequest {
    val cents = raw["amount"]?.jsonPrimitive?.longOrNull
        ?: throw BadRequest("amount must be an integer")
    if (cents <= 0) throw BadRequest("amount must be positive")
    val to = AccountId.parse(raw["to"]?.jsonPrimitive?.content)
        ?: throw BadRequest("invalid destination account")
    // inward from here, only narrowed domain values travel
    return TransferRequest(Money(cents), to)
}
'''
bad = '''
suspend fun transfer(call: ApplicationCall) {
    val body = call.receive<Map<String, String>>()
    // raw external strings flow straight into the core
    ledger.transfer(
        amountCents = body["amount"]!!.toLong(), // "-500" ok
        toAccount = body["to"]!!, // any string whatsoever
    )
}
'''

