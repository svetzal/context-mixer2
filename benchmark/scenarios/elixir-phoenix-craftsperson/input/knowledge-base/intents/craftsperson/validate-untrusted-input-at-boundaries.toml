[examples.rust]
good = '''
pub fn handle(raw: &str) -> Result<Response, ApiError> {
    let req: TransferRequest = serde_json::from_str(raw)
        .map_err(|_| ApiError::Malformed)?;
    let amt = Cents::parse(&req.amount)
        .map_err(|_| ApiError::InvalidAmount)?;
    let acct = AccountId::parse(&req.account_id)
        .map_err(|_| ApiError::UnknownAccount)?;
    // the core receives only narrowed domain values
    core::transfer(acct, amt)
}
'''
bad = '''
pub fn handle(raw: &str) -> Result<Response, ApiError> {
    let v: serde_json::Value = serde_json::from_str(raw)?;
    // raw, unvalidated strings flow inward
    core::transfer(
        v["account_id"].as_str().unwrap_or(""),
        v["amount"].as_str().unwrap_or("0"),
    )
}
// deep in the core, hostile input finally explodes
pub fn transfer(acct: &str, amt: &str) -> Result<Response, E> {
    let amt: u64 = amt.parse().unwrap(); // panics on "1e9;--"
    debit(acct, Cents(amt))
}
'''

[examples.swift]
good = '''
struct Email {
    let value: String
    init?(_ raw: String) {
        guard raw.contains("@"), raw.count <= 254 else {
            return nil
        }
        value = raw.lowercased()
    }
}

func handleSignup(_ body: Data) throws {
    let raw = try JSONDecoder().decode(RawSignup.self,
                                       from: body)
    guard let email = Email(raw.email) else {
        throw HTTPError.badRequest("invalid email")
    }
    userService.create(email: email)  // narrowed value inward
}
'''
