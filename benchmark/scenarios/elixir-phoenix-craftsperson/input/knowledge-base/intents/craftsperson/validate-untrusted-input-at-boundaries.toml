def create(conn, params) do
  # parsed and narrowed ONCE at the boundary; the core
  # receives domain values, never raw external maps
  case OrderInput.parse(params["order"]) do
    {:ok, %OrderInput{sku: sku, qty: qty}} ->
      json(conn, Orders.place(sku, qty))

