app.post("/orders", (req, res) => {
  // req.body is any; hostile shapes flow straight inward.
  const { sku, qty } = req.body;
  placeOrder(sku, qty);
  res.sendStatus(201);
});

// Deep in the core, far from the boundary:
function placeOrder(sku: string, qty: number): void {
  db.run(`UPDATE stock SET n = n - ${qty}
