[examples.typescript]
good = '''
const OrderRequest = z.object({
  sku: z.string().regex(/^[A-Z]{3}-\d{4}$/),
  qty: z.number().int().positive().max(100),
});
type OrderRequest = z.infer<typeof OrderRequest>;

app.post("/orders", (req, res) => {
  const parsed = OrderRequest.safeParse(req.body);
  if (!parsed.success) {
    return res.status(400).json({ issues: parsed.error.issues });
  }
  placeOrder(parsed.data); // core sees only narrowed values
  return res.sendStatus(201);
});
'''
