[examples.elixir]
good = '''
@doc """
Splits a full name into given and family parts.

Since v2.3 empty input returns `{:error, :blank}`.

    iex> Names.split("Ada Lovelace")
    {:ok, {"Ada", "Lovelace"}}

    iex> Names.split("")
    {:error, :blank}
"""
# doctest runs in CI — the examples cannot drift silently
'''
bad = '''
@doc """
Splits a full name. Returns nil when input is empty.
"""
# the behavior changed two releases ago; the docs still
# promise nil, and nothing executable would ever notice
def split(""), do: {:error, :blank}
def split(name) do
  [given, family] = String.split(name, " ", parts: 2)
  {:ok, {given, family}}
end
'''

