[examples.clojure]
good = '''
;; change: default page size 20 -> 50 (perf review 2026-07)
(defn list-orders
  "Returns orders newest-first. `:limit` defaults to 50,
  maximum 200."
  [{:keys [limit] :or {limit 50}}]
  (take (min limit 200) (orders-newest-first)))

;; same commit: README quickstart example re-run and updated —
;; (list-orders {})  ;=> 50 orders
'''
bad = '''
(defn list-orders
  "Returns orders newest-first. `:limit` defaults to 20."
  [{:keys [limit] :or {limit 50}}]  ; changed; docstring wasn't
  (take (min limit 200) (orders-newest-first)))

;; README still calls 20 "the default" and the pagination
;; guide still documents the old maximum of 100
'''

