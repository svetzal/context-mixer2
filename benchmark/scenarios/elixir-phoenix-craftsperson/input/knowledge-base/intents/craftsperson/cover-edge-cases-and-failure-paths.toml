[examples.typescript]
good = '''
describe("parseQuantity", () => {
  it("accepts a plain positive integer", () => {
    expect(parseQuantity("3")).toEqual({ ok: true, value: 3 });
  });
  it("rejects zero and negatives", () => {
    expect(parseQuantity("0").ok).toBe(false);
    expect(parseQuantity("-2").ok).toBe(false);
  });
  it("rejects empty and non-numeric input", () => {
    expect(parseQuantity("").ok).toBe(false);
    expect(parseQuantity("abc").ok).toBe(false);
  });
});
'''
bad = '''
describe("parseQuantity", () => {
  // Only sunny-day inputs; empty, zero, negative, and junk
  // are all unspecified and free to regress.
  it("works", () => {
    expect(parseQuantity("3")).toEqual({ ok: true, value: 3 });
  });
  it("works again", () => {
    expect(parseQuantity("10")).toEqual({ ok: true, value: 10 });
  });
});
'''
