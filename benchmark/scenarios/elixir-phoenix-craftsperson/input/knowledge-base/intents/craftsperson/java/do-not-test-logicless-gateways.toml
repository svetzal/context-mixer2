status = "hypothesized"
confidence = 0.96
capability = "Test effort remains concentrated on business behavior and meaningful integration contracts."
threat = "Unit tests for pure delegation duplicate library behavior and become brittle without increasing confidence."
expectation = "The number of external adapters will grow and compete for finite test-maintenance effort."
strategy = "Skip isolated tests for gateways that only translate and delegate; use integration tests for wiring and move any custom logic into the core."
evidence = [{ type = "test_inventory", description = "Logicless gateways have no mock-heavy unit tests, while their wiring is covered at an integration boundary.", required = true }]
tradeoff = "Adapter-specific regressions may be discovered later by slower integration tests."
