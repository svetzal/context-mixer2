status = "hypothesized"
confidence = 0.99
capability = "Conflicting design improvements can be resolved through a stable, explainable priority order."
threat = "A lower-value cleanup displaces correctness or clarity because the team treats all design heuristics as equally urgent."
expectation = "Passing tests, readability, duplication removal, and structural minimization will sometimes recommend different next changes."
strategy = "Resolve conflicts by prioritizing passing tests, revealed intent, removal of duplicated knowledge, and minimal entities in that order, escalating project constraints."
evidence = [{ type = "decision_review", description = "When simple-design heuristics conflict, the chosen change records which higher-priority rule controlled the decision or which project constraint required escalation.", required = true }]
tradeoff = "A fixed priority order can underweight performance, framework, or delivery constraints that require stakeholder judgment."
