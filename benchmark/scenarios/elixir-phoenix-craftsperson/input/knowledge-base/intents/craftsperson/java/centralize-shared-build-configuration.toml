id = "guidelines.intent.centralize-shared-build-configuration"
title = "Centralize shared build configuration"
category = "delivery"
tags = ["java", "concurrency", "dependencies", "build-and-delivery", "builds", "configuration"]
relations = [
  { type = "specializes", target = "craftsperson/make-build-configuration-explicit" },
