sources = [{ type = "document", ref = "plugins/jvm-ecosystem/agents/java-craftsperson.md#architectural-patterns", summary = "Makes minimal entities the fourth Simple Design rule and names unnecessary classes, methods, indirection, and configuration.", confidence = 1.0 }]
