sources = [{ type = "document", ref = "plugins/jvm-ecosystem/agents/java-craftsperson.md#architectural-patterns", summary = "Calls for pragmatic application of Single Responsibility, Open/Closed, Liskov, Interface Segregation, and Dependency Inversion.", confidence = 1.0 }]
