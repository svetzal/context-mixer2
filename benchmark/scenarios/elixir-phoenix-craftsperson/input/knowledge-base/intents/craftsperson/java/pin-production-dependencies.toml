sources = [{ type = "document", ref = "plugins/jvm-ecosystem/agents/java-craftsperson.md#build-and-dependency-management", summary = "Requires explicitly pinned versions and rejects ranges and SNAPSHOT dependencies in production.", confidence = 1.0 }]
