status = "hypothesized"
confidence = 0.99
capability = "Business logic can be understood and tested without frameworks, networks, databases, or filesystems."
threat = "I/O and mutation spread through domain code and make behavior slow, nondeterministic, and difficult to reuse."
expectation = "Infrastructure integrations will change independently from the business rules they serve."
strategy = "Keep business logic pure or side-effect-free and push I/O and orchestration into an imperative adapter shell."
