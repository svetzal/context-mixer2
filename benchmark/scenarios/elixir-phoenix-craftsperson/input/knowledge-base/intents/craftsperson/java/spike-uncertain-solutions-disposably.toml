status = "hypothesized"
confidence = 0.97
capability = "The team can learn about unfamiliar technology without allowing exploratory compromises into production design."
threat = "Uncertainty either stalls progress or turns provisional experiments into permanent low-quality code."
expectation = "Some integrations and techniques will remain unfamiliar until exercised concretely."
strategy = "Build narrowly scoped throwaway spikes to answer specific questions, then delete them and implement the learned solution cleanly."
evidence = [{ type = "workflow_trace", description = "An exploratory spike has a stated learning question, is excluded from the delivered implementation, and its conclusion informs clean production code.", required = true }]
tradeoff = "Throwing code away duplicates effort and can tempt teams to polish the spike instead."
