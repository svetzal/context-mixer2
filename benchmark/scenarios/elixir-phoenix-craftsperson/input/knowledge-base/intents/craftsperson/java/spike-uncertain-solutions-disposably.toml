id = "guidelines.intent.spike-uncertain-solutions-disposably"
title = "Explore uncertainty with disposable spikes"
category = "design"
tags = ["java", "testing", "build-and-delivery", "idioms", "language-design", "ecosystem-conventions"]
relations = [
