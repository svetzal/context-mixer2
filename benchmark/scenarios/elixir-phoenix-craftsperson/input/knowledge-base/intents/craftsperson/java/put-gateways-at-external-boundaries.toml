id = "guidelines.intent.put-gateways-at-external-boundaries"
title = "Put gateways at every external boundary"
category = "architecture"
tags = ["java", "persistence", "gateways", "external-systems", "dependency-inversion"]
relations = [
  { type = "specializes", target = "craftsperson/put-gateways-at-external-boundaries" },
