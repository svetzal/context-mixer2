status = "hypothesized"
confidence = 0.99
capability = "The application controls stable contracts for databases, APIs, filesystems, and HTTP interactions."
threat = "Direct third-party calls spread vendor APIs through the codebase and make replacement or isolation expensive."
expectation = "External services, libraries, and persistence technologies will evolve independently from application needs."
strategy = "Route every external interaction through a small application-owned gateway interface."
evidence = [{ type = "architecture_gate", description = "Dependency analysis finds external I/O clients referenced only from gateway implementations and composition code.", required = true }]
tradeoff = "Boundary interfaces add indirection and can be needless when an integration is trivial and stable."
