id = "guidelines.intent.standardize-project-tooling"
title = "Standardize project operations on canonical tooling"
category = "delivery"
tags = ["tooling", "project-management", "repeatability"]
relations = [
  { type = "related-to", target = "craftsperson/inspect-project-context-before-changing-it" },
