[examples.clojure]
good = '''
(defn parse-signup [params]
  (select-keys params [:email :name]))

(defn valid-signup? [{:keys [email]}]
  (boolean (re-matches #".+@.+" email)))

(defn signup! [store mailer params]
  (let [s (parse-signup params)]
    (when (valid-signup? s)
      (store s)
      (mailer (:email s) :welcome))))
; parsing, validation, orchestration change independently
'''
bad = '''
(defn handle-signup [params]
  ; parses, validates, persists, emails, logs, and formats
  ; the HTTP response — six reasons to change, one function
  (let [email (str/lower-case (get params "email"))]
    (if (re-matches #".+@.+" email)
      (do (jdbc/execute! db ["insert into users values (?)"
                             email])
          (smtp/send! {:to email :template :welcome})
          (log/info "signup" email)
          {:status 201 :body (json/write-str {:ok true})})
      {:status 400 :body (json/write-str {:err "bad email"})})))
'''

