// changes through this one class.
export class InvoiceManager {
  total(lines: Line[]): number {
    return lines.reduce((s, l) => s + l.price * l.qty, 0);
  }
  async renderPdf(inv: Invoice): Promise<Uint8Array> {
    return pdf.layout(inv, { font: "Inter", margin: 24 });
  }
  async email(inv: Invoice, to: string): Promise<void> {
    await smtp.send(to, "Invoice", await this.renderPdf(inv));
  }
  async retryFailedEmails(): Promise<void> {
