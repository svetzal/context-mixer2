[examples.ruby]
good = '''
class InvoiceTotaler
  def initialize(lines:) = @lines = lines
  def total = @lines.sum(&:amount)
end

class InvoiceMailer
  def initialize(invoice:) = @invoice = invoice

  def deliver
    Mail.deliver(to: @invoice.email, body: render(@invoice))
  end
end
'''
bad = '''
class InvoiceManager
  # totaling, mailing, persistence, and PDF: four reasons to
  # change riding in one change magnet
  def total(lines) = lines.sum(&:amount)
  def deliver!(invoice) = Mail.deliver(to: invoice.email)
  def save(invoice) = DB[:invoices].insert(invoice.to_h)
  def to_pdf(invoice) = PdfRenderer.render(invoice)
  def sync_to_quickbooks(invoice) = Qb.push(invoice)
end
'''

[examples.rust]
good = '''
// one reason to change per unit
pub struct PriceList { rates: HashMap<Sku, Cents> }
impl PriceList {
    pub fn quote(&self, cart: &Cart) -> Cents {
        cart.items().map(|i| self.rates[&i.sku] * i.qty).sum()
    }
}
pub struct ReceiptPrinter;
impl ReceiptPrinter {
    pub fn render(&self, total: Cents) -> String {
        format!("TOTAL {total}")
    }
}
'''
bad = '''
// pricing, rendering, retry policy, and audit in one magnet
impl OrderManager {
    pub fn handle(&mut self, cart: &Cart) -> Result<(), Error> {
        let total: Cents = cart.items()
            .map(|i| self.rates[&i.sku] * i.qty).sum();
        let receipt = format!("TOTAL {total}");
        for attempt in 0..3 {                 // retry policy
            if self.smtp.send(&receipt).is_ok() { break; }
            std::thread::sleep(RETRY_DELAY * attempt);
        }
        self.audit_log.push(receipt);         // audit trail
        Ok(())
    }
}
'''

