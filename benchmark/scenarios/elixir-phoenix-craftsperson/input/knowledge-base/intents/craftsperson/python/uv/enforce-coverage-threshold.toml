id = "guidelines.intent.enforce-coverage-threshold"
title = "Enforce the project's coverage threshold"
category = "testing"
tags = ["python", "uv", "testing", "coverage", "risk", "critical-paths"]
relations = [
  { type = "specializes", target = "craftsperson/use-coverage-as-a-risk-signal" },
]
status = "hypothesized"
confidence = 0.99
capability = "The exercised share of the codebase does not silently decline as behavior is added or changed."
threat = "A green test suite can leave newly added paths entirely unexecuted."
expectation = "Feature growth will continually add branches and modules that are easy to omit from tests."
strategy = "Run pytest with coverage and require the configured threshold before completion."
evidence = [{ type = "coverage_gate", description = "uv run pytest --cov succeeds and reports coverage at or above the repository threshold.", required = true }]
tradeoff = "A numeric threshold can reward low-value execution and adds runtime without proving assertion quality."
