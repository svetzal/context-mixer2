]
status = "hypothesized"
confidence = 0.99
capability = "Collaborators can surface uncertainty, defects, and alternatives without personal threat."
threat = "Personalized or adversarial review discourages disclosure and turns technical disagreement into interpersonal risk."
expectation = "Code review will repeatedly expose mistakes and competing ideas among people with different context."
strategy = "Review the code rather than the colleague, assume positive intent, and frame critiques as curious questions about alternatives."
evidence = [{ type = "review_observation", description = "Review comments address concrete code or behavior, avoid personal attribution, and invite consideration of alternatives without hostility.", required = true }]
tradeoff = "Careful phrasing takes time and can soften urgent technical feedback if reviewers avoid directness."
