strategy = "Generate uv.lock from project metadata and commit it as the reproducible dependency resolution."
evidence = [{ type = "manifest_gate", description = "uv.lock is version-controlled and a clean uv sync completes without rewriting it.", required = true }]
tradeoff = "The lockfile creates review churn and must be deliberately refreshed for dependency updates."
