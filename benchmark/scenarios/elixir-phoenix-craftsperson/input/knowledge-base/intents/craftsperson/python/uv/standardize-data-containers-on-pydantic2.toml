sources = [{ type = "document", ref = "plugins/python-ecosystem/agents/uv-python-craftsperson.md#data-structures", summary = "Mandates Pydantic 2 models instead of dataclasses for data containers to unify validation, serialization, and schemas.", confidence = 1.0 }]
