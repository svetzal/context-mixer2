id = "guidelines.intent.use-native-annotation-syntax"
title = "Use native modern annotation syntax"
category = "design"
tags = ["python", "uv", "domain-modeling", "type-safety", "invariants"]
relations = [
  { type = "specializes", target = "craftsperson/make-invalid-states-explicit" },
