capability = "The test suite concentrates on project-owned behavior rather than duplicating third-party library tests."
threat = "Tests for pass-through adapters become brittle mirrors of vendor calls without proving domain behavior."
expectation = "Gateway libraries and call signatures will evolve independently from the core policy."
strategy = "Omit unit tests for pure I/O-isolating gateways; if a gateway contains custom logic, move that logic to the core before testing it."
evidence = [{ type = "test_review", description = "Gateway tests exist only for documented project-owned behavior, and logicless delegation is not mocked call-for-call.", required = true }]
