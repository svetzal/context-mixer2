status = "hypothesized"
confidence = 0.97
capability = "One-off utilities can run reproducibly without becoming project dependencies or polluting global environments."
threat = "Installing transient tools into the project or globally creates dependency churn and version ambiguity."
expectation = "Maintenance will occasionally require utilities that do not import or execute the project itself."
strategy = "Run standalone or version-specific ephemeral utilities with uvx, reserving uv run for tools that require project context."
evidence = [{ type = "dependency_review", description = "One-off standalone tools are invoked with uvx and are absent from project dependency groups unless the project actually relies on them.", required = true }]
