[examples.typescript]
good = '''
// Gateway: translate and forward, nothing else.
export class HttpRateGateway implements RateSource {
  constructor(private readonly http: Http) {}
  async current(code: string): Promise<Rate> {
    const res = await this.http.get(`/rates/${code}`);
    return { code, value: res.data.value };
  }
}

// Policy lives in the core, tested without any HTTP.
export const applyMarkup = (r: Rate): Rate =>
  ({ ...r, value: r.value * 1.02 });
'''
bad = '''
// Markup policy and fallback rules trapped in the adapter;
// exercising them now requires a live HTTP stack.
export class HttpRateGateway implements RateSource {
  private lastKnown = 1;
  constructor(private readonly http: Http) {}
  async current(code: string): Promise<Rate> {
    const res = await this.http.get(`/rates/${code}`);
    let value = res.data.value * 1.02;      // business markup
    if (code === "USD") value += 0.001;     // special case
    if (value <= 0) value = this.lastKnown; // fallback policy
    this.lastKnown = value;
    return { code, value };
  }
}
'''
