  def send_code(phone:, body:)
    twilio.messages.create(to: phone, body: body)
  end
end

# policy lives in the core, tested without Twilio
def code_message(user:, code:)
  greeting = user.locale == "fr" ? "Votre code" : "Your code"
  "#{greeting}: #{code}"
end
'''
bad = '''
class SmsGateway
  def send_code(user:, code:)
    # business policy trapped inside the adapter
    return if user.suspended? || user.quiet_hours?(Time.now)
    body = user.locale == "fr" ? "Votre code" : "Your code"
    body += " (retry)" if user.attempts > 1
    twilio.messages.create(to: user.phone, body: "#{body}: #{code}")
  end # none of these decisions testable without Twilio stubbed
end
'''

[examples.rust]
good = '''
// the gateway only translates and forwards
impl PaymentGateway for StripeGateway {
    fn charge(&self, req: Charge) -> Result<Receipt, PayErr> {
        let resp = self.client.post("/charges", req.to_form())?;
        Receipt::try_from(resp)
    }
}
// the discount decision lives in the core, tested directly
pub fn amount_due(order: &Order) -> Cents {
    if order.total() >= Cents(10_000) {
        order.total().less_percent(5)
    } else {
        order.total()
    }
}
'''
bad = '''
impl PaymentGateway for StripeGateway {
    fn charge(&self, order: &Order) -> Result<Receipt, PayErr> {
        // discount policy buried in the adapter — it can only
        // be exercised through a live Stripe call now
        let mut amount = order.total();
        if amount >= Cents(10_000) {
            amount = amount.less_percent(5);
        }
        let resp = self.client.post("/charges", form(amount))?;
        Receipt::try_from(resp)
    }
}
'''

