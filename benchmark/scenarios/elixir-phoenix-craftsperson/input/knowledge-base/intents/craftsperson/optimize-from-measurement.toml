[examples.clojure]
good = '''
;; requirement: report render p95 < 200ms (SLO dashboard)
;; baseline (criterium, prod-shaped 50k rows): 640ms
;; profile: 82% of time re-parsing dates inside the row loop
(defn render-report [rows]
  (let [parse (memoize parse-date)]   ; the measured hotspot
    (mapv #(row-html (update % :date parse)) rows)))
;; after, same benchmark: 96ms — SLO met, no regression in
;; the memory profile
'''
bad = '''
(defn render-report [rows]
  ; rewrote with transients because it "felt slow" — no
  ; stated requirement, no baseline, no profile
  (loop [r (seq rows), acc (transient [])]
    (if r
      (recur (next r) (conj! acc (row-html (first r))))
      (persistent! acc))))
; the actual bottleneck (date re-parsing) is untouched;
; clarity was spent and nothing measurable was bought
'''

[examples.cpp]
good = '''
Requirement: catalog search p95 < 150ms (SLO doc, sec 3).

Baseline (perf + representative 10k-query replay):
  p95 = 412ms; 71% of samples inside SkuIndex::rescan().
Change: cache the rescan result; invalidate on catalog write.
After, same replay: p95 = 96ms; write path unchanged (+0.4%).

Benchmark committed: bench/sku_index_bench.cpp (Google
Benchmark), wired into the nightly perf job as a guardrail.
'''
bad = '''
// No profile, no stated requirement — "malloc is slow, right?"
char g_scratch[64 * 1024];              // hand-rolled arena...
void* fastAlloc(std::size_t n) {        // ...in the config
  static std::size_t used = 0;          // loader, which runs
  void* p = g_scratch + used;           // exactly once at boot
  used += (n + 15) & ~std::size_t{15};
  return p;                             // no bounds, no free
}
// complexity added to a path no measurement ever implicated
'''

