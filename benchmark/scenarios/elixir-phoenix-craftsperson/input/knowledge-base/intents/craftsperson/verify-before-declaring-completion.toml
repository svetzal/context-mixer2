[examples.swift]
good = '''
Done: coupon-stacking fix.

Verified:
  swift test (full suite): 412 passed, 0 failed
  manual: stacked 2 coupons on the sandbox build; total
  matched the spec's worked example ($18.20)

Not verified:
  App Store receipt path — needs a signed build; handed to
