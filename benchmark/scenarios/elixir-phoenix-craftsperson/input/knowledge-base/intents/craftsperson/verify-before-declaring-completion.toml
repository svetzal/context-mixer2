'''
bad = '''
Done report — password-reset fix:
  "Fixed! The mailer change should work now."

  - diff never re-read (a debug `puts` is still in it)
  - specs not run (2 were failing)
  - flow never exercised; the reset link 404s
  # "should work" reported as "works"
'''

[examples.rust]
good = '''
