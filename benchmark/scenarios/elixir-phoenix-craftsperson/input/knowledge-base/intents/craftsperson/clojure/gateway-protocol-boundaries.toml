sources = [{ type = "document", ref = "plugins/clojure-ecosystem/agents/clojure-craftsperson.md#1-functional-purity", summary = "All databases, APIs, filesystems, and HTTP interactions are directed through mockable gateway protocols or namespaces.", confidence = 1.0 }]
