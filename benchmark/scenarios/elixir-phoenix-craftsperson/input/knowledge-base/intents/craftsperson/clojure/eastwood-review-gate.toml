sources = [{ type = "document", ref = "plugins/clojure-ecosystem/agents/clojure-craftsperson.md#quality-tools-you-wield", summary = "Eastwood is required at least before significant commits, with all warnings addressed except documented exceptions.", confidence = 1.0 }, { type = "document", ref = "plugins/clojure-ecosystem/agents/clojure-craftsperson.md#quality-gates-mandatory", summary = "The stronger completion gate requires Eastwood before any code review is complete.", confidence = 1.0 }]
