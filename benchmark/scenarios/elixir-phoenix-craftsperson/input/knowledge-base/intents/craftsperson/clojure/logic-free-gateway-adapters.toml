id = "guidelines.intent.logic-free-gateway-adapters"
title = "Keep gateway adapters thin and logic-free"
category = "architecture"
tags = ["clojure", "testing", "gateways", "business-logic", "separation-of-concerns"]
relations = [
  { type = "specializes", target = "craftsperson/keep-gateways-logic-free" },
