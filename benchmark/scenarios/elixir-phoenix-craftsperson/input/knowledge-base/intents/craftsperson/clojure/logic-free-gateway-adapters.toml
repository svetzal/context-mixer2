sources = [{ type = "document", ref = "plugins/clojure-ecosystem/agents/clojure-craftsperson.md#1-functional-purity", summary = "Gateway functions should be thin wrappers without testable logic, and custom logic should be moved into the core.", confidence = 1.0 }]
