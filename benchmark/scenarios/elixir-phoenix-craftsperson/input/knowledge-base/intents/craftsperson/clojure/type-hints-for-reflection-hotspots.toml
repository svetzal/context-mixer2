status = "hypothesized"
confidence = 0.9
capability = "Ability to execute performance-sensitive JVM interop without avoidable reflective dispatch"
threat = "Unresolved JVM member calls add runtime reflection overhead in hot paths"
expectation = "Interop-heavy code may enter latency- or throughput-critical workloads"
strategy = "Add targeted type hints where compiler reflection warnings or profiling show they are needed"
evidence = [{ type = "static-check", description = "Compilation with reflection warnings enabled reports no reflection in designated hot paths", required = true }, { type = "benchmark", description = "The hinted path satisfies its stated performance target without changing behavior", required = true }]
tradeoff = "Type hints couple code to JVM representations, add visual noise, and can become wrong after refactoring"
