id = "guidelines.intent.type-hints-for-reflection-hotspots"
title = "Eliminate reflection where measured performance requires it"
category = "design"
tags = ["clojure", "static-analysis", "performance", "abstraction", "evidence", "duplication"]
relations = [
  { type = "specializes", target = "craftsperson/delay-abstraction-until-evidence" },
