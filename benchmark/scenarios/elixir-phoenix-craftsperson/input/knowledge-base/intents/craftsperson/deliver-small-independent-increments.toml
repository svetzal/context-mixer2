$ git show --stat 7d2c9aa
    Retry on 429, upgrade httpx, reformat client module,
    rename config keys, fix unrelated date bug

 src/client.py     | 512 ++++++++++++------------
 src/config.py     |  88 +++--
 src/dates.py      |  12 +-
# reverting the bad rename now takes the bugfix with it
'''

[examples.ruby]
good = '''
commit 1: Add Money#allocate for splitting invoice totals
  (unit tested, no callers yet — ships dark)
commit 2: Use Money#allocate in invoice line rounding
commit 3: Remove now-dead InvoiceRounder float math

Each commit passes the full suite on its own and reverts
cleanly without disturbing the others.
'''
bad = '''
commit: "Invoice rework + misc"
  47 files changed, 2310 insertions(+), 1875 deletions(-)
  - new rounding engine
  - unrelated RuboCop autofixes across app/
  - drive-by rename of User#name
  - half of a feature flag for taxes

Reverting the rounding bug takes the rename and flag with it.
'''

[examples.rust]
good = '''
$ git log --oneline -3
9f2c1aa refactor: extract RateTable lookup (behavior kept)
b81d044 feat: charge per-kg rate for US destinations
c3a97e0 fix: reject zero-weight parcels at intake

# each commit builds green on its own and reverts cleanly;
# the rate change can roll back without losing the fix
'''
bad = '''
$ git log --oneline -1
4e19b02 US rates + intake fix + reformat + WIP retry logic

$ git show --stat 4e19b02 | tail -1
 87 files changed, 4211 insertions(+), 1980 deletions(-)

# rolling back the rate bug also reverts the intake fix,
# and review cannot tell intent from accident
'''

[examples.swift]
