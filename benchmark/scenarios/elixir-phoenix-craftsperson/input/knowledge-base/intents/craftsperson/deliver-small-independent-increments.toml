a1f9d02 Add rate-limit header parsing to the API client
c37be21 Retry idempotent requests on 429 using Retry-After
e90c4d5 Document retry behavior in the client README

# each commit has one purpose, passed the gate on its own,
# and reverts cleanly without dragging anything else out
'''
