sources = [{ type = "document", ref = "plugins/swift-ecosystem/agents/swift-craftsperson.md#simple-design-heuristics", summary = "Explicitly orders four design heuristics, calls them guidelines rather than iron laws, and requires consultation when they conflict.", confidence = 1.0 }]
