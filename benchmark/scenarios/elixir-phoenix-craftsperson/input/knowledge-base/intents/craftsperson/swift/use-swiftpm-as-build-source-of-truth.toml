sources = [{ type = "document", ref = "plugins/swift-ecosystem/agents/swift-craftsperson.md#build-and-dependency-management", summary = "Names SwiftPM as the primary tool and Package.swift as the definition of modules, targets, and dependencies.", confidence = 1.0 }]
