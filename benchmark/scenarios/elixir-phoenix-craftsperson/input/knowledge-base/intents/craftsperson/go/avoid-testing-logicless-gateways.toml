sources = [{ type = "document", ref = "plugins/go-ecosystem/agents/go-craftsperson.md#maintain-comprehensive-tests", summary = "Says not to test I/O-isolating gateways without custom logic and prefers moving such logic into the core.", confidence = 1.0 }]
