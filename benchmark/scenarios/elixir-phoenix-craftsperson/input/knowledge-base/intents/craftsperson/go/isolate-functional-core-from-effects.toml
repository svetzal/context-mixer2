sources = [{ type = "document", ref = "plugins/go-ecosystem/agents/go-craftsperson.md#functional-core-imperative-shell", summary = "Keeps business logic pure-ish and pushes I/O, goroutines, and side effects to edges.", confidence = 1.0 }]
