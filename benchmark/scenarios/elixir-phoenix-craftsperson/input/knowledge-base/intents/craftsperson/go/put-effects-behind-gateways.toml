id = "guidelines.intent.put-effects-behind-gateways"
title = "Route every external interaction through a gateway"
category = "architecture"
tags = ["go", "persistence", "gateways", "external-systems", "dependency-inversion"]
relations = [
  { type = "specializes", target = "craftsperson/put-gateways-at-external-boundaries" },
]
status = "hypothesized"
confidence = 0.99
capability = "The application can replace or simulate external systems without changing its business logic."
threat = "Direct database, HTTP, file-system, or library calls spread infrastructure coupling through the core."
expectation = "External services, persistence technology, and client libraries will change independently of application behavior."
strategy = "Place all external interactions behind explicit gateway interfaces at the system boundary."
evidence = [{ type = "architecture_test", description = "Core packages import no external I/O clients and all database, API, file-system, and HTTP access is reachable only through gateway implementations.", required = true }]
tradeoff = "Gateway interfaces and adapters add indirection and boilerplate around straightforward library calls."
scope = { project = "guidelines", paths = ["plugins/go-ecosystem/agents/go-craftsperson.md"] }
sources = [{ type = "document", ref = "plugins/go-ecosystem/agents/go-craftsperson.md#functional-core-imperative-shell", summary = "Requires all databases, APIs, file systems, and HTTP interactions to pass through gateway interfaces.", confidence = 1.0 }]
