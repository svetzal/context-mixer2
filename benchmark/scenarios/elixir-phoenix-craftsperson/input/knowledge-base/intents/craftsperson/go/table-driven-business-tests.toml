sources = [{ type = "document", ref = "plugins/go-ecosystem/agents/go-craftsperson.md#maintain-comprehensive-tests", summary = "Requires table-driven tests for all business logic and repeats them as the preferred scenario structure.", confidence = 1.0 }]
