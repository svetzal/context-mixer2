sources = [{ type = "document", ref = "plugins/go-ecosystem/agents/go-craftsperson.md#simple-design-heuristics-in-priority-order", summary = "Lists minimal entities and removal of unnecessary indirection, types, parameters, and abstractions as a priority.", confidence = 1.0 }]
