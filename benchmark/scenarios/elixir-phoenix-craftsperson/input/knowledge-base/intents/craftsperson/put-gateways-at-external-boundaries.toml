    func isDelinquent(_ user: User) async throws -> Bool
}

struct PricingEngine {
    let billing: BillingStatusProviding
    func discount(for user: User) async throws -> Decimal {
        try await billing.isDelinquent(user) ? 0 : 0.1
    }
}
// StripeBillingGateway implements the contract at the edge;
// the core never names the vendor
'''
bad = '''
struct PricingEngine {
    func discount(for user: User) async throws -> Decimal {
        // vendor URL and transport inside decision code
        let url = URL(string:
            "https://api.stripe.com/v1/customers/\(user.id)")!
        let (data, _) = try await URLSession.shared
            .data(from: url)
        let c = try JSONDecoder()
            .decode(StripeCustomer.self, from: data)
        return c.delinquent ? 0 : 0.1
    }
}
'''

[examples.typescript]
