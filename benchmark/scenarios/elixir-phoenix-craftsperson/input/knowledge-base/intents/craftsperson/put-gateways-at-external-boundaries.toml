// Owned contract; the core depends on this, not on Stripe.
export interface PaymentGateway {
  charge(cents: number, token: string): Promise<ChargeResult>;
}

// Decision code sees only the boundary contract.
export async function checkout(
  cart: Cart, pay: PaymentGateway,
): Promise<ChargeResult> {
  return pay.charge(totalCents(cart), cart.paymentToken);
}
'''
bad = '''
import Stripe from "stripe";

// Vendor SDK constructed and called inside decision code;
// core tests need Stripe, and changing vendors rewrites
// business logic.
export async function checkout(cart: Cart): Promise<void> {
  const stripe = new Stripe(process.env.STRIPE_KEY!);
  const intent = await stripe.paymentIntents.create({
    amount: totalCents(cart), currency: "usd",
    payment_method: cart.paymentToken, confirm: true,
  });
  if (intent.status !== "succeeded")
    throw new Error("payment failed");
}
