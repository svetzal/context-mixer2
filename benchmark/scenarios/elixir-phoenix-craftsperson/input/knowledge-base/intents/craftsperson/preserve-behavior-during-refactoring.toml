bad = '''
// commit message: "refactor invoice module"
fun tax(amount: Money): Money =
    amount * rate // was amount.times(rate).round(HALF_UP)
// the "refactor" silently switched rounding to truncation
// while the suite was already red, so nobody can tell the
// regression apart from the restructuring
'''

