'''

[examples.kotlin]
good = '''
$ ./gradlew test         # green baseline captured first
BUILD SUCCESSFUL — 214 tests

# step 1: extract TaxPolicy          -> suite green
# step 2: collapse redundant DTO     -> suite green
# step 3: rename internals           -> suite green

