id = "guidelines.intent.review-with-psychological-safety"
title = "Review with psychological safety"
category = "collaboration"
tags = ["code-review", "psychological-safety", "feedback"]
relations = [
  { type = "related-to", target = "craftsperson/make-review-feedback-actionable" },
  { type = "related-to", target = "craftsperson/escalate-consequential-tradeoffs" },
]
status = "hypothesized"
confidence = 0.99
capability = "Review participants can examine correctness and design risks candidly without personal attack or defensiveness."
threat = "Judgmental feedback targets the author, asserts preference as fact, or withholds the reasoning needed for collaboration."
expectation = "Technical review will surface disagreement among people with different information, experience, and constraints."
strategy = "Critique observable code and ideas with curiosity, distinguish defects from preferences, and acknowledge sound decisions."
evidence = [{ type = "review_audit", description = "Review comments address code and consequences rather than personal attributes and clearly distinguish required changes from suggestions.", required = true }]
tradeoff = "Careful framing takes time and can soften urgency if severe risks are not still stated plainly."
scope = { project = "guidelines", paths = ["plugins/jvm-ecosystem/agents/java-craftsperson.md", "plugins/python-ecosystem/agents/python-craftsperson.md", "plugins/rust-ecosystem/agents/rust-craftsperson.md", "plugins/typescript-ecosystem/agents/typescript-craftsperson.md"] }
sources = [{ type = "document", ref = "plugins/jvm-ecosystem/agents/java-craftsperson.md#when-reviewing-code", summary = "Makes psychological safety and classification of feedback part of code review.", confidence = 1.0 }, { type = "document", ref = "plugins/python-ecosystem/agents/python-craftsperson.md#workflow--collaboration", summary = "Preserves psychological safety during technical review.", confidence = 1.0 }, { type = "document", ref = "plugins/rust-ecosystem/agents/rust-craftsperson.md#code-review-philosophy", summary = "Critiques code rather than people and acknowledges sound choices.", confidence = 1.0 }]

# --- code examples (rendered by the intent atlas; managed by site/merge_examples.py) ---

[examples.clojure]
good = '''
Nice catch moving validation before the write — that closes
the race we discussed last sprint.

Question on line 58: `pmap` shares `conn` across threads,
and next.jdbc connections aren't thread-safe — I believe
this can corrupt results under load. Worth a test? [required]

Style thought, take it or leave it: `->>` might read more
naturally than the nested maps here. [suggestion]
'''
bad = '''
Did you even run this? pmap over a shared connection — this
is exactly the kind of sloppy work I keep flagging from you.

Rewrite it properly this time.

; targets the author, asserts blame as fact, splits nothing
; into required vs. preference — and the one real defect is
; never actually explained
'''

[examples.cpp]
good = '''
Nice catch using a scoped connection here — that plugs the
leak pattern from last sprint.

Question on parseRetry(): when the header is missing we
default to 0 and hammer the server. Was that deliberate?
If not, suggest the RFC's 1s minimum. [required — risk of
production incident]

Lambda vs named slot is a preference, not a defect — take
it or leave it. [suggestion]
'''
bad = '''
Did you even test this?? A first-year student would know
better than to parse headers this way.

Wrong. Rewrite it.

I don't have time to explain — just do it the way I would.

(targets the author, asserts preference as fact, withholds
reasoning; next time the author won't ask for review early)
'''

[examples.csharp]
good = '''
review: CartService.cs:58 [question → maybe blocking]
What led to caching the cart here? I may be missing
context, but with two web nodes I think a stale cart
can survive checkout — if so that's a defect we should
fix before merge. The extraction below is a suggestion
only, take it or leave it. Nice catch on the decimal
rounding in Totals(), by the way — that was subtle.
'''
bad = '''
review: CartService.cs:58
Did you even read the codebase before touching it?
Caching here is obviously wrong — anyone who has
worked on carts knows better. This is sloppy work,
and honestly typical of your last few PRs. Rewrite
it properly this time.
'''

[examples.elixir]
good = '''
"This retry loop could hammer the API while it's down —
what would you think about exponential backoff here?
(blocking; happy to pair on it)"

"Style note, take or leave: `with` might read better
than the nested case here. Preference, not a defect."

"The changeset validation split is really clean — I'm
stealing that pattern."
'''
bad = '''
"Did you even read the docs before writing this?"

"This is amateur hour. My way is obviously correct."

"Rewrite it. I shouldn't have to explain why."

(targets the author, asserts preference as fact,
withholds all reasoning, acknowledges nothing sound —
and buries the one genuine defect in the noise)
'''

[examples.go]
good = '''
Review comment:

  This retry loop can re-send a charge when the ack times out —
  am I reading that right? If so, an idempotency key would
  close the gap, and your gateway split makes that a small
  change. That split also made this easy to review — thanks.

  (blocking: the double-charge; everything else is suggestion)
'''
bad = '''
Review comments:

  "Did you even test this?"
  "Anyone who has written Go for more than a week wouldn't
   do it this way."
  "Rewrite it properly."

# targets the author, asserts taste as fact, offers no
# reasoning to engage with — next time nobody asks for review
'''

