The streaming rewrite in InvoiceTotals is a genuine
simplification — nice. One optional thought: a short
comment on the rounding choice would help the next
reader. Not blocking."
'''
bad = '''
"Did you even read the codebase before touching this?
Obviously the cache key is wrong. Sloppy work — this is
