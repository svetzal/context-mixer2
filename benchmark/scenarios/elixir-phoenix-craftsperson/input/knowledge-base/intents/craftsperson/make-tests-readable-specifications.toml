public void Late_return_accrues_daily_fee_after_grace()
{
    var rental = RentalDueDaysAgo(days: 5);

    var fee = rental.LateFee(graceDays: 2);

    fee.Should().Be(Money.Cad(3 * DailyLateFee));
}
'''
bad = '''
[Fact]
public void Test12()
{
    var r = Helper.Make(1, 5, true, null, 2);
    var x = r.Calc();
    Assert.True(x > 0);         // which behavior?
    Assert.Equal(4, Helper.N);  // incidental global
    Assert.NotNull(r.Inner);    // structural noise
}
'''

[examples.elixir]
good = '''
test "an expired coupon does not reduce the order total" do
  order = build(:order, total: 100)
  coupon = build(:coupon, expires_on: ~D[2020-01-01])

  {:ok, priced} = Pricing.apply_coupon(order, coupon)

  assert priced.total == 100
end
'''
bad = '''
test "test1" do
  x = run_all(prep(fixtures(:everything)), 3)

  assert x
  assert length(elem(x, 1).items) != 0 or true
  # when this fails, which behavior was violated?
  # nobody — including its author — can say
end
'''

[examples.go]
good = '''
func TestExpiredCouponIsRejectedAtCheckout(t *testing.T) {
	cart := cartWith(t, item("book", 1200))
	coupon := couponExpiredOn(t, "2026-01-01")

	err := cart.Apply(coupon)

	if !errors.Is(err, ErrCouponExpired) {
		t.Fatalf("want ErrCouponExpired, got %v", err)
	}
}
'''
bad = '''
func TestCoupon2(t *testing.T) {
	h := setup(t, true, false, 3, "x", nil) // what do these mean?
	r := h.run()
	if r.code != 4 {
		t.Fatal("bad result") // which expectation broke? why 4?
	}
	if len(h.log) > 0 && h.flags["z"] {
		t.Error("log not empty") // incidental assertion
	}
}
'''

[examples.java]
good = '''
@Test
void refundRestoresGiftCardBalance() {
    var card = GiftCard.withBalance(euros(50));
    card.charge(euros(20));

    card.refund(euros(20));

    assertEquals(euros(50), card.balance());
}
'''
bad = '''
@Test
void test3() {
    var h = TestHarness.mk(CFG, true, null, 7);
    h.run();
    assertEquals(50, h.a().get(0).x()); // which expectation?
    assertNotNull(h.b());               // incidental
    assertTrue(h.log().size() > 0);     // incidental
}
// a failure here names no behavior; diagnosis requires
// reading the harness and the implementation
'''

