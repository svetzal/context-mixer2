id = "guidelines.intent.make-tests-readable-specifications"
title = "Make tests readable behavioral specifications"
category = "testing"
tags = ["readability", "executable-specification", "behavior"]
status = "hypothesized"
confidence = 0.98
capability = "A reader can learn required behavior and diagnose a failure directly from the test suite."
threat = "Opaque names, oversized arrangements, and incidental assertions hide what a test protects."
expectation = "Tests will serve as the most current executable account of behavior for maintainers and agents."
strategy = "Give each test one behavior, intention-revealing names, visible arrange-act-assert flow, and assertions on meaningful outcomes."
evidence = [{ type = "test_review", description = "Each test states one behavior and its failure identifies the violated expectation without reading implementation code.", required = true }]
tradeoff = "More explicit test structure can repeat setup and produce longer suites."
scope = { project = "guidelines", paths = ["plugins/clojure-ecosystem/agents/clojure-craftsperson.md", "plugins/python-ecosystem/agents/python-craftsperson.md", "plugins/typescript-ecosystem/agents/typescript-craftsperson.md", "plugins/typescript-ecosystem/agents/typescript-bun-cli-craftsperson.md"] }
sources = [{ type = "document", ref = "plugins/clojure-ecosystem/agents/clojure-craftsperson.md#unit-tests-structure", summary = "Makes tests readable behavioral specifications.", confidence = 1.0 }, { type = "document", ref = "plugins/python-ecosystem/agents/python-craftsperson.md#testing-patterns", summary = "Structures tests as readable specifications.", confidence = 1.0 }, { type = "document", ref = "plugins/typescript-ecosystem/agents/typescript-bun-cli-craftsperson.md#testing-patterns", summary = "Uses behavior-describing test names and separable setup.", confidence = 1.0 }]

# --- code examples (rendered by the intent atlas; managed by site/merge_examples.py) ---

[examples.clojure]
good = '''
(deftest expired-coupon-is-rejected-at-checkout
  ;; arrange
  (let [cart   (cart-with {:total 100})
        coupon (expired-coupon "SAVE10")
        ;; act
        result (apply-coupon cart coupon)]
    ;; assert
    (is (= :coupon/expired (:error result)))
    (is (= 100 (:total result)) "total is unchanged")))
'''
bad = '''
(deftest test2
  (let [x (setup)]  ; 40-line fixture defined in another ns
    (is (= 100 (:t (f x "SAVE10"))))
    (is (:e2 (f x "BOGUS")))
    (is (nil? (:e2 (f x "SAVE10"))))
    (is (= 3 (count @log)))))  ; incidental — why 3?
; when this fails, which behavior broke? only the
; implementation knows
'''

[examples.cpp]
good = '''
TEST(Refunds, RejectsRefundLargerThanOriginalCharge) {
  // arrange
  auto payment = paidPayment(Money{50});

  // act
  auto result = refund(payment, Money{80});

  // assert
  EXPECT_EQ(result.error(), Err::ExceedsCharge);
}
'''
bad = '''
TEST(RefundTest, Test3) {
  auto p = h.mk(50, 2, true, "x", cfg_);  // what is any of this
  h.prep(p);
  h.go();
  auto r = refund(p, Money{80});
  EXPECT_FALSE(r.ok());
  EXPECT_EQ(h.log().size(), 7u);   // incidental assertion
  EXPECT_TRUE(h.flag_);            // asserts... something
}
// failure message: "h.flag_ is false" — violated rule unknown
'''

[examples.csharp]
good = '''
