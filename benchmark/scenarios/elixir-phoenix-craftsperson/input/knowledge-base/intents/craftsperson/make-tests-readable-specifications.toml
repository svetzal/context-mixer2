[examples.python]
good = '''
def test_expired_coupon_is_rejected_at_checkout():
    coupon = a_coupon(expires=YESTERDAY)
    cart = a_cart(items=[BOOK])

    result = apply_coupon(cart, coupon)

    assert result == CouponRejected(reason="expired")
    # name + arrange/act/assert state the rule; the failure
    # message alone names the violated expectation
'''
bad = '''
def test_1():
    c = setup_all(True, False, 3, None, "X9")   # of what?
    r = run(c)
    assert r[0] == 7
    assert len(r[1]) != 0
    assert helper_check(r, c.flags)
    # fails as "assert False" — which behavior broke, and
    # what was even required, is anyone's guess
'''

[examples.ruby]
good = '''
RSpec.describe Cart do
  it "removes the line when quantity drops to zero" do
    cart = Cart.new(lines: [Line.new(sku: "A1", qty: 1)])

    cart.decrement(sku: "A1")

    expect(cart.lines).to be_empty
  end
end
'''
bad = '''
RSpec.describe Cart do
  it "works" do
    c = build_cart_with_everything # 40-line opaque helper
    c.decrement(sku: "A1")
    expect(c.lines.size).to eq(c.initial_size - 1)
    expect(c.instance_variable_get(:@dirty)).to be true # why?
    expect(c.audit_log.last).to match(/decr/) # incidental
  end
end
'''

[examples.rust]
