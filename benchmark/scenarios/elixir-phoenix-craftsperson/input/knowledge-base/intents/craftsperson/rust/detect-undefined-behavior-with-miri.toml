sources = [{ type = "document", ref = "plugins/rust-ecosystem/agents/rust-craftsperson.md#optional-but-recommended-for-unsafeffi-or-security-critical-code", summary = "Recommends Miri to detect undefined behavior in unsafe code.", confidence = 1.0 }]
