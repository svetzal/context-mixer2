sources = [{ type = "document", ref = "plugins/rust-ecosystem/agents/rust-craftsperson.md#code-review-philosophy", summary = "Makes psychological safety, rationale, alternatives, and explicit tradeoffs part of code review.", confidence = 1.0 }]
