sources = [{ type = "document", ref = "plugins/rust-ecosystem/agents/rust-craftsperson.md#unsafe-and-ffi-non-negotiable-rules", summary = "Mandates SAFETY comments explaining invariants and why they hold.", confidence = 1.0 }]
