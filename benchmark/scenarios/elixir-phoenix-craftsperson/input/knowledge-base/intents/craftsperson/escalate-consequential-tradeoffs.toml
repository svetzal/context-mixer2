Purging inactive accounts frees ~40% storage but is
irreversible and touches EU users (export duty first?).
  A) hard delete after export — cheap, irreversible
  B) anonymize in place — reversible, keeps 60% of cost

Recommend B until legal confirms A is safe. Your call —
holding the migration until you decide.
'''
bad = '''
commit 4f2a91c "cleanup: purge inactive accounts"

# an irreversible, product-visible deletion decided
# inline by whoever happened to write the migration
def up do
  execute("DELETE FROM accounts WHERE last_seen < ...")
end

(no options surfaced, no owner sign-off, no rationale)
'''

[examples.go]
good = '''
Message to product owner, before implementation:

  Support wants to replay failed charges, which needs stored
  card data. Options:
    a) store gateway tokens — replay limited to 24h, no PCI
       scope change, ~2 days of work
    b) store PANs encrypted — full replay, Level 1 PCI audit
       (~$40k/yr, ~3 months) plus breach liability
  Recommendation: (a). This is your call, not mine to default.

Decision recorded in docs/decisions/0014-charge-replay.md
'''
bad = '''
commit 88ac2f1
    Store card numbers so support can retry charges

    Seemed handy for the support team. Base64-encoded them in
    the users table for now.

# an irreversible, security-sensitive tradeoff decided silently
# by whoever happened to be editing the file that afternoon
'''

[examples.java]
good = '''
PR note, tagged @product-owner, before merging:

Storing card fingerprints locally speeds repeat checkout
but pulls us into PCI SAQ-D scope (annual audit, ~$40k).

  (a) store fingerprint here — fastest UX, audit burden
  (b) tokenize via processor — +80 ms, no scope change

Recommendation: (b). This is your call, not mine —
holding the merge until you decide.
'''
bad = '''
commit 7d2f19c
  Store raw card fingerprints for faster repeat checkout

  Went with local storage since it was simplest to wire up.

# a compliance-scope change rode into main inside a routine
# "performance improvement" — nobody with the authority to
# accept a $40k/yr audit obligation ever saw the choice
'''

[examples.kotlin]
good = '''
Message to the product owner before merging:

  Search indexing choice is product-visible:
    A) rebuild inline — always-fresh results, ~300ms extra
       latency on every save
    B) async rebuild — fast saves, results stale up to 10 min
  Recommendation: B plus a staleness note in the UI.
  This affects users directly, so it is your call — holding
  the merge until you confirm.
'''
bad = '''
// a product-visible tradeoff decided silently by whoever
// happened to be editing this file that afternoon
suspend fun save(doc: Doc) {
    repo.save(doc)
    scope.launch { searchIndex.rebuild() } // stale <= 10 min
}
// no options weighed, no owner asked, no decision recorded
'''

[examples.python]
good = '''
To: @product-owner — needs your call before I proceed.

Account closure must either:
  A) hard-delete rows now — simplest, but irreversible and
     breaks the auditor's 7-year retention expectation
  B) soft-delete + scheduled purge — keeps the audit trail,
     adds a job we own (~2 days)
Recommend B. A is a compliance risk beyond my authority to
accept; I'll hold this branch until you decide.
'''
bad = '''
commit 4be129c
    Hard-delete users on account closure

    Went with hard delete since it was simpler than adding
