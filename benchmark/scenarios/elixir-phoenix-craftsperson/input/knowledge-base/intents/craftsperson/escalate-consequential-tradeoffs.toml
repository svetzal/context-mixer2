# an irreversible, compliance-sensitive tradeoff decided
# silently by implementation convenience
'''

[examples.ruby]
good = '''
PR comment (dev -> tech lead):

Purging soft-deleted users frees 40% of the table, but it is
irreversible and GDPR export requests sometimes arrive at
day ~45. Options:
  a) purge at 30d — cheapest, risks failing export requests
  b) purge at 90d — safe, keeps most of the cost savings
Recommend (b). This touches a compliance promise — your call.

Lead: Agreed, (b). Recorded in DECISIONS.md#user-purge.
'''
bad = '''
# dev decides an irreversible, compliance-visible tradeoff
# alone, in code, without surfacing it
class PurgeJob
  def perform
    # 30 feels reasonable
    User.soft_deleted.where("deleted_at < ?", 30.days.ago)
        .delete_all # nobody with authority ever saw this choice
  end
end
'''

[examples.rust]
good = '''
Posted before implementing:

  Purging stale sessions can run as one transaction (locks
  the table ~40s at our size) or in batches (no lock, but a
  stale session may linger up to 5 minutes).
  Recommendation: batched — the lock risks checkout
  timeouts. Customer-visible either way; needs an owner.

Decision (product owner, in thread): batched. Five minutes
of staleness is acceptable; checkout latency is not.
'''
bad = '''
// a one-way door decided silently by local preference:
// sessions moved from Postgres to Redis "because faster" —
// they now vanish on every Redis restart, which support
// will discover as mass logouts

Commit: "perf: move sessions to redis"

// no options laid out, no consequences named, no owner
// asked — a heuristic made a product-visible call
'''

[examples.swift]
