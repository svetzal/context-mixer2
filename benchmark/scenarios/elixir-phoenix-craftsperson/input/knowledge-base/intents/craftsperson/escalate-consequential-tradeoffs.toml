id = "guidelines.intent.escalate-consequential-tradeoffs"
title = "Escalate consequential tradeoffs"
category = "collaboration"
tags = ["decision-making", "escalation", "tradeoffs"]
status = "hypothesized"
confidence = 0.98
capability = "High-impact choices are made by someone with the authority and context to accept their consequences."
threat = "A heuristic or local preference decides a costly, irreversible, security-sensitive, or product-visible tradeoff."
expectation = "Engineering principles will sometimes conflict and available evidence will not determine one uniquely correct answer."
strategy = "Explain the competing options, consequences, evidence, and recommendation, then seek a decision from the appropriate authority."
evidence = [{ type = "decision_review", description = "Consequential unresolved tradeoffs have an explicit decision and rationale from an appropriate owner.", required = true }]
tradeoff = "Escalation adds coordination latency and can become avoidance if used for ordinary reversible decisions."
scope = { project = "guidelines", paths = ["plugins/cpp-qt-ecosystem/agents/cpp-qt-craftsperson.md", "plugins/elixir-ecosystem/agents/elixir-craftsperson.md", "plugins/typescript-ecosystem/agents/typescript-craftsperson.md", "plugins/python-ecosystem/agents/uv-python-craftsperson.md"] }
sources = [{ type = "document", ref = "plugins/cpp-qt-ecosystem/agents/cpp-qt-craftsperson.md#escalation-strategy", summary = "Escalates uncertain high-impact decisions with options and tradeoffs.", confidence = 1.0 }, { type = "document", ref = "plugins/typescript-ecosystem/agents/typescript-craftsperson.md#escalation-strategy", summary = "Escalates conflicts among requirements, security, performance, and design heuristics.", confidence = 1.0 }]

# --- code examples (rendered by the intent atlas; managed by site/merge_examples.py) ---

[examples.clojure]
good = '''
;; Message to @maya (service owner), before merging:
;;
;; Retry policy for payment capture — two options:
;;  A) retry 3x with backoff: fewer dropped orders, but can
;;     double-charge when the PSP call succeeds ambiguously
;;  B) no retry, park for manual review: safe, adds ~20
;;     ops tickets/week
;; Recommend B until PSP idempotency keys land. Your call.
;;
;; -> Decision (Maya): B; revisit after the PSP upgrade.
;;    Recorded in ADR-019.
'''
bad = '''
(defn capture-payment! [order]
  ; quietly picked aggressive retries; ambiguous PSP timeouts
  ; can double-charge — nobody with revenue authority was asked
  (retrying {:attempts 3 :backoff-ms 200}
    (psp/capture! (:payment order))))
; no ADR, no thread, no reviewer flagged for the tradeoff
'''

[examples.cpp]
good = '''
To: @stacey (product owner)

Payment retries — two viable options; this needs your call.
  A) Retry 3x with backoff. Smoother UX, but risks a double
     charge when PSP webhooks lag (seen twice in prod logs).
  B) Fail fast and ask the user to retry. Safe, but worse
     conversion at checkout.
Evidence: PSP docs sec 4.2; incident 2026-05-11.
Recommendation: B until the PSP confirms idempotency keys.
Holding the merge until you decide.
'''
bad = '''
// A double-charge-vs-conversion tradeoff, decided silently
// by whoever happened to be editing this file:
for (int attempt = 0; attempt < 3; ++attempt) {
  if (psp.charge(order).ok()) break;   // no idempotency key
}
// Merged Friday 6pm. No reviewer, no note to the product
// owner, no record that the alternative was ever considered.
'''

[examples.csharp]
good = '''
PR note (dev → owner):
Retiring the v1 export API breaks 3 known integrators.
Options:
  a) remove now — clean code, angry integrators
  b) 90-day deprecation shim — dual paths until Oct
Evidence: access logs show 41 v1 calls/day.
Recommend (b). Product-visible and irreversible —
needs your call before I proceed.

Decision (owner): (b). Announce Monday. Logged.
'''
bad = '''
// dev settles an irreversible, product-visible
// tradeoff alone, on a Friday deploy
app.MapPost("/api/v1/export", () =>
    Results.Problem("v1 removed, use v2"));
// 41 calls/day, 3 integrators, zero options surfaced,
// no owner ever saw the decision
'''

[examples.elixir]
good = '''
