who can measure response times can recover a token byte by
byte (CWE-208). subtle.ConstantTimeCompare closes it — happy
to pair on the change if useful.

[suggestion] token.go:12 — "mgr" reads ambiguously here;
"issuer" would match the package vocabulary. Fine to skip.
'''
