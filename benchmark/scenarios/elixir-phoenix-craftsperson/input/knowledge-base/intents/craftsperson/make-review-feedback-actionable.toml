id = "guidelines.intent.make-review-feedback-actionable"
title = "Make review feedback actionable"
category = "collaboration"
tags = ["code-review", "feedback", "remediation"]
status = "hypothesized"
confidence = 0.98
capability = "A contributor can understand, prioritize, and resolve each review finding without guessing the reviewer's intent."
threat = "Vague criticism names a dislike without locating the evidence, explaining the consequence, or offering a path forward."
expectation = "Reviewers and implementers will have different local context and may not share the same preferred solution."
strategy = "Tie each finding to concrete evidence, explain why it matters, classify its severity, and offer alternatives with tradeoffs where useful."
evidence = [{ type = "review_audit", description = "Each required finding identifies a location or behavior, consequence, priority, and feasible next action.", required = true }]
tradeoff = "Detailed feedback takes longer to prepare and can over-prescribe implementation if alternatives are framed too narrowly."
scope = { project = "guidelines", paths = ["plugins/dotnet-ecosystem/agents/csharp-craftsperson.md", "plugins/go-ecosystem/agents/go-craftsperson.md", "plugins/jvm-ecosystem/agents/java-craftsperson.md", "plugins/ruby-ecosystem/agents/ruby-craftsperson.md"] }
sources = [{ type = "document", ref = "plugins/dotnet-ecosystem/agents/csharp-craftsperson.md#code-review-protocol", summary = "Makes findings actionable and explains technical rationale and tradeoffs.", confidence = 1.0 }, { type = "document", ref = "plugins/go-ecosystem/agents/go-craftsperson.md#code-review-approach", summary = "Requires concrete actionable review findings.", confidence = 1.0 }, { type = "document", ref = "plugins/ruby-ecosystem/agents/ruby-craftsperson.md#communication-style", summary = "Makes review feedback specific, respectful, and actionable.", confidence = 1.0 }]

# --- code examples (rendered by the intent atlas; managed by site/merge_examples.py) ---

[examples.clojure]
good = '''
[blocking] handlers/orders.clj:41 — the `swap!` into `cache`
runs after the jdbc insert but outside the transaction. If
the insert rolls back, the cache serves a phantom order (this
caused incident #212). Suggest moving it to the :after-commit
hook, or dropping the cache here — reads are already fast per
the June benchmarks.

[nit, non-blocking] `ord` -> `order`, matching this ns.
'''
bad = '''
"This caching code is messy. Please clean it up."

"Not how I would have done it."

"Did you think about edge cases?"

; no location, no consequence, no severity, and no way to
; know what change would satisfy the reviewer
'''

[examples.cpp]
good = '''
[blocking] src/session.cpp:84 — the mutex is released before
sessions_.erase(it), so a concurrent lookup can hit a freed
iterator (same class of bug as INC-231). Suggest holding the
lock through the erase, or the scoped-lock pattern already
used at session.cpp:41. Happy to pair on it.

[nit, non-blocking] mgr -> sessionManager would match this
file's naming; fine to skip if you disagree.
'''
bad = '''
This is wrong.

Also I wouldn't have done it this way.

Needs work. Please fix and re-request review.

(no file, no line, no consequence, no severity, no path
forward — the author is left to guess all four)
'''

