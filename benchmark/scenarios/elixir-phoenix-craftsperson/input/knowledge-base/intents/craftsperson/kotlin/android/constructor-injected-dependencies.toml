status = "hypothesized"
confidence = 0.99
capability = "Ability to see, supply, and substitute every required collaborator."
threat = "Field injection, service lookup, or internal construction hides dependencies and complicates testing."
expectation = "Components will gain collaborators and be instantiated in multiple scopes and tests."
strategy = "Use Hilt constructor injection for dependencies wherever construction permits it."
