sources = [{ type = "document", ref = "plugins/jvm-ecosystem/agents/kotlin-craftsperson.md#test-structure", summary = "The source repeatedly requires mocking only gateway or boundary interfaces and wrapping third-party libraries first.", confidence = 1.0 }]
