status = "hypothesized"
confidence = 0.99
capability = "Ability to render changing collections efficiently while retaining item-local state across reordering."
threat = "Eager columns and position-based identity recompose too much and attach state to the wrong item."
expectation = "Dynamic lists will grow and reorder as live data changes."
strategy = "Render dynamic collections with LazyColumn and stable item keys."
evidence = [{ type = "gate", description = "UI tests reorder and update list data without state migration, and inspection shows keyed lazy items rather than eager Column loops.", required = true }]
tradeoff = "Stable keys require domain identity and lazy layouts add measurement and testing complexity."
