status = "hypothesized"
confidence = 1.0
capability = "Ability to keep the working revision in a trusted, diagnosable state throughout change work."
threat = "Continuing after a failed gate compounds defects and encourages symptom suppression."
expectation = "Changes and their fixes will interact across formatting, analysis, tests, security, and documentation."
strategy = "Stop on a failing gate, identify and properly fix its root cause, then rerun the complete gate set."
evidence = [{ type = "trace", description = "Change-session logs show work paused at the first failed gate, record a root-cause fix rather than suppression, and end with all mandatory gates passing.", required = true }]
tradeoff = "Fail-fast recovery interrupts delivery flow and a full rerun can be expensive after a localized fix."
