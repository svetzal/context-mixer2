sources = [{ type = "document", ref = "plugins/jvm-ecosystem/agents/kotlin-craftsperson.md#documentation-with-dokka", summary = "The source requires KDoc on all public APIs and documents parameters, returns, and thrown exceptions.", confidence = 1.0 }]
