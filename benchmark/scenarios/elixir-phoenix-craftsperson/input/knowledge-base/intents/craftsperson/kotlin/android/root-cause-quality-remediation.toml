id = "guidelines.intent.root-cause-quality-remediation"
title = "Preserve the signal of quality gates"
category = "documentation"
tags = ["kotlin", "android", "documentation", "error-handling", "synchronization", "behavior"]
relations = [
  { type = "specializes", target = "craftsperson/keep-documentation-aligned" },
