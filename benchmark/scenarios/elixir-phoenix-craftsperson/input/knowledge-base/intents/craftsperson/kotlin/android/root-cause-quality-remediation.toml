sources = [{ type = "document", ref = "plugins/jvm-ecosystem/agents/kotlin-android-craftsperson.md#quality-gates-mandatory", summary = "The source forbids warning suppression as a shortcut and requires fixing root causes and rerunning all checks.", confidence = 1.0 }]
