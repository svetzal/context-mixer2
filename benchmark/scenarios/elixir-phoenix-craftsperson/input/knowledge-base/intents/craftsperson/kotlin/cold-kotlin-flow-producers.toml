id = "guidelines.intent.cold-kotlin-flow-producers"
title = "Keep deferred stream production cold by default"
category = "reliability"
tags = ["kotlin", "persistence", "build-and-delivery", "resource-management", "cleanup", "ownership"]
relations = [
