status = "hypothesized"
confidence = 1.0
capability = "Ability to handle missing values without unexpected null-pointer failures."
threat = "Non-null assertions and unexamined nullable types defer invalid assumptions to runtime."
expectation = "Data will continue to arrive from external, Java, persistence, and partially populated sources."
strategy = "Avoid non-null assertions and handle nullable values with safe calls, Elvis expressions, and explicit null-flow constructs."
evidence = [{ type = "static_check", description = "Production code contains no unexplained !! operators, and tests cover both present and absent cases for nullable inputs.", required = true }]
tradeoff = "Explicit absence handling adds branches and can propagate nullable or result types through APIs."
