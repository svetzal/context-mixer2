id = "guidelines.intent.structured-kotlin-coroutine-lifetimes"
title = "Bind coroutine work to an explicit owner"
category = "reliability"
tags = ["kotlin", "concurrency", "error-handling", "structured-concurrency", "cancellation"]
relations = [
