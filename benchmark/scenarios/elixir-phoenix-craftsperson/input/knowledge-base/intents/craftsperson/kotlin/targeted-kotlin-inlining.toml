id = "guidelines.intent.targeted-kotlin-inlining"
title = "Inline only performance-critical Kotlin abstractions"
category = "design"
tags = ["kotlin", "performance", "idioms", "language-design", "ecosystem-conventions"]
relations = [
  { type = "specializes", target = "craftsperson/use-language-and-ecosystem-idioms" },
