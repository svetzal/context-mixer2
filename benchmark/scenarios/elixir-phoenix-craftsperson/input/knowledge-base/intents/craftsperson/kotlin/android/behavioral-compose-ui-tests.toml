id = "guidelines.intent.behavioral-compose-ui-tests"
title = "Protect user-visible Compose behavior"
category = "design"
tags = ["kotlin", "android", "testing", "idioms", "language-design", "ecosystem-conventions"]
relations = [
  { type = "specializes", target = "craftsperson/use-language-and-ecosystem-idioms" },
