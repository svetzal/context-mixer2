status = "hypothesized"
confidence = 0.99
capability = "Ability to detect regressions in user interactions and resulting UI state."
threat = "Implementation-only tests can pass while taps, typing, navigation, or rendered outcomes fail."
expectation = "Compose screens will add interactions and state-dependent presentation."
strategy = "Write Compose UI tests around user actions and observable state updates rather than implementation structure."
evidence = [{ type = "gate", description = "Tests drive semantic user interactions and assert visible outcomes without relying on internal composable hierarchy details.", required = true }]
tradeoff = "Behavioral UI tests are slower and more sensitive to environment and animation timing than unit tests."
