bad = '''
[Fact]
public async Task Cancel_calls_collaborators_in_order()
{
    await _service.Cancel(orderId);
    // pins private wiring; fails on every harmless
    // refactor, passes if stock math is wrong
    Received.InOrder(() =>
    {
        _repo.Load(orderId);
        _stock.Release(Arg.Any<Reservation>());
        _repo.Save(Arg.Any<Order>());
    });
}
'''

[examples.elixir]
good = '''
test "checkout charges the discounted total exactly once" do
  cart = build(:cart, total: 100, coupon: "SAVE10")

  {:ok, receipt} = Checkout.run(cart)

  # outcomes a consumer can observe; internals stay free
  assert receipt.charged == 90
  assert [%Charge{amount: 90}] = Payments.charges(cart)
end
'''
bad = '''
test "checkout runs its private steps in order" do
  {:ok, _} = Checkout.run(build(:cart))

  # welded to internals: any harmless refactor —
  # renaming a step, merging two — fails this test
  # while behavior is unchanged
  state = :sys.get_state(Checkout.Server)
  assert state.steps_run ==
           [:validate, :apply_discounts_p, :persist]
end
'''

[examples.go]
good = '''
func TestTotalIncludesSalesTax(t *testing.T) {
	c := NewCheckout(catalog)
	c.Add(item("book", 1000))

	got := c.Total()

	if got != 1130 {
		t.Fatalf("want 1130 (13%% tax), got %d", got)
	}
	// internals may reshuffle freely; this fails only when
	// the consumer-visible total is wrong
}
'''
bad = '''
func TestCheckoutRecalculation(t *testing.T) {
	c := NewCheckout(catalog)
	c.Add(item("book", 1000))
	c.recalculate() // drives an unexported step directly

	if len(c.pendingLineItems) != 1 { // asserts a private field
		t.Fatal("expected 1 pending item")
	}
	// fails on any internal reshuffle, even when every total
	// the customer can observe stays correct
}
'''

[examples.java]
good = '''
@Test
void bulkOrdersGetTenPercentOff() {
    var cart = cartWith(items(12, dollars(10)));

    var priced = pricing.price(cart);

    assertEquals(dollars(108), priced.total());
    // asserts the outcome customers see; everything
    // inside PricingService is free to change shape
}
'''
bad = '''
@Test
void appliesDiscountInternals() {
    var calculator = mock(RuleCalculator.class);
    var svc = new PricingService(calculator);

    svc.price(cart);

    // welded to private choreography, not outcomes
    verify(calculator).preload(cart);
    verify(calculator).applyRules(cart, RuleSet.DEFAULT);
}
// fails on any refactor — even ones that keep every
// price correct
'''

[examples.kotlin]
good = '''
@Test fun `applying a coupon reduces the checkout total`() {
    val cart = Cart().add(item(price = 100_00))

    cart.apply(Coupon("SAVE10"))

    // an outcome consumers can see; survives restructuring
    assertThat(cart.total()).isEqualTo(Money(90_00))
}
'''
bad = '''
@Test fun `applying a coupon uses the calculator`() {
    val calc = spyk(DiscountCalculator())
    val cart = Cart(calc).add(item(price = 100_00))

    cart.apply(Coupon("SAVE10"))

    // pins private call order; fails on harmless refactors
    verifyOrder { calc.validate(any()); calc.recompute(any()) }
}
'''

[examples.python]
good = '''
def test_cancelling_order_releases_reserved_stock():
    shop = Shop(stock={"book": 2})
    order = shop.place_order("book", qty=2)

    shop.cancel(order.id)

    # outcome a consumer observes through the public API;
    # survives any internal restructuring
    assert shop.available("book") == 2
'''
bad = '''
def test_cancel_order():
    shop = Shop(stock={"book": 2})
    shop._ledger = Mock()             # reach into privates
    order = shop.place_order("book", qty=2)

    shop.cancel(order.id)

    # asserts internal call shape, not any outcome; fails
    # on harmless refactors, passes if stock stays wrong
    shop._ledger.release.assert_called_once_with("book", 2)
'''

[examples.ruby]
good = '''
it "grants the loyalty discount on the third order" do
  customer = Customer.new
  2.times { place_order(customer: customer, cents: 10_00) }

  third = place_order(customer: customer, cents: 10_00)

  expect(third.total_cents).to eq(9_00) # outcome a buyer sees
end
'''
bad = '''
it "grants the loyalty discount on the third order" do
  customer = Customer.new
  # asserts private choreography, not any visible outcome
  expect(customer).to receive(:apply_discount!)
    .with(percent: 10)
  expect(DiscountLedger).to receive(:record)

  place_order(customer: customer, cents: 10_00)
  # renaming apply_discount! fails this; a wrong total passes
end
'''

