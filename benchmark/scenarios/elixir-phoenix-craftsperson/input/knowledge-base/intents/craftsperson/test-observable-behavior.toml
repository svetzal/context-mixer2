[examples.clojure]
good = '''
(deftest cancelling-order-releases-its-stock
  (let [store (fresh-store)
        order (place-order store {:sku "A1" :qty 2})]
    (cancel-order store (:id order))
    ; asserts the outcome a consumer can observe
    (is (= 2 (available store "A1")))))
; survives any internal restructuring of how holds work
'''
bad = '''
(deftest cancelling-order-releases-its-stock
  (let [calls (atom [])]
    (with-redefs [inventory/release-hold!  ; private internal
                  (fn [& args] (swap! calls conj args))]
      (cancel-order (fresh-store) "ord-1")
      ; asserts the implementation's private call sequence
      (is (= [["A1" 2]] @calls)))))
; renaming release-hold! breaks this test; actually losing
; the stock does not
'''

[examples.cpp]
good = '''
TEST(Cart, RemovingLastItemYieldsEmptyCart) {
  Cart cart;
  cart.add(sku("A"), 1);

  cart.remove(sku("A"));

  EXPECT_TRUE(cart.isEmpty());        // consumer-visible
  EXPECT_EQ(cart.total(), Money{0});  // outcomes only
}
// survived last month's storage rewrite without an edit
'''
bad = '''
TEST(Cart, RemoveErasesFromInternalMap) {
  Cart cart;
  auto& internals = CartTestPeer::map(cart);  // private access
  cart.add(sku("A"), 1);
  cart.remove(sku("A"));
  EXPECT_EQ(internals.bucket_count(), 8u);    // incidental
  EXPECT_TRUE(CartTestPeer::dirtyFlag(cart)); // mechanism
}
// went red when storage moved from map to vector, though no
// consumer-visible behavior changed — refactoring now "breaks"
'''

[examples.csharp]
