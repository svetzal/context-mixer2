bad = '''
#[test]
fn subscribe_normalizes_then_inserts() {
    let mut list = MailingList::new();
    list.subscribe("A@example.com");
    // asserts private structure; breaks when the map is
    // swapped for a sorted vec though behavior is identical
    assert!(list.index.contains_key("a@example.com"));
    assert_eq!(list.normalize_calls, 1);
}
'''

