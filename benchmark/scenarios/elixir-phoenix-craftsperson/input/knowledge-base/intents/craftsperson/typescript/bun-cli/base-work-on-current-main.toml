status = "hypothesized"
confidence = 0.9
capability = "Each proposed change starts from a known shared integration baseline while remaining isolated for review."
threat = "Work based on stale or unrelated history accumulates avoidable conflicts and ambiguous dependencies."
expectation = "Multiple changes will proceed concurrently while main continues to advance."
strategy = "Create each work branch from current main and keep it current enough to expose integration conflicts before merge."
