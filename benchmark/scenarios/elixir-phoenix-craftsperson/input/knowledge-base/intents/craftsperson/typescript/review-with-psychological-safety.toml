status = "hypothesized"
confidence = 0.99
capability = "Ability for collaborators to challenge designs, disclose uncertainty, and learn without personal threat"
threat = "Personalized or adversarial critique suppresses questions and turns technical disagreement into defensive behavior"
expectation = "Teams will repeatedly review imperfect ideas under delivery pressure"
strategy = "Critique code and ideas with curiosity, assume positive intent, and avoid judgments about colleagues"
evidence = [{ type = "review", description = "Review comments address observable code or design consequences, use inquiry for alternatives, and contain no personal attribution", required = true }]
tradeoff = "Careful phrasing takes time and may feel less direct when urgent defects need decisive correction"
