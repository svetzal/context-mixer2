id = "guidelines.intent.keep-gateways-thin"
title = "Keep gateways thin and free of business logic"
category = "architecture"
tags = ["typescript", "testing", "gateways", "external-systems", "dependency-inversion"]
relations = [
  { type = "specializes", target = "craftsperson/put-gateways-at-external-boundaries" },
]
status = "hypothesized"
confidence = 0.99
capability = "Ability to test business decisions without exercising external I/O"
threat = "Logic embedded in gateway adapters becomes difficult to isolate and encourages tests of infrastructure wrappers"
expectation = "External providers and libraries will change while core business rules should remain stable"
strategy = "Limit gateway classes to translating and forwarding external interactions, moving custom logic into the core"
evidence = [{ type = "review", description = "Gateway methods contain only boundary translation or delegation, and any branching business rule has a core test", required = true }]
tradeoff = "Strictly thin gateways can require additional core types and translation steps for small integrations"
