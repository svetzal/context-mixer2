sources = [{ type = "document", ref = "plugins/typescript-ecosystem/agents/typescript-bun-cli-craftsperson.md#subprocess-execution", summary = "Requires subprocess output capture and demonstrates separately piped stdout and stderr.", confidence = 1.0 }]
