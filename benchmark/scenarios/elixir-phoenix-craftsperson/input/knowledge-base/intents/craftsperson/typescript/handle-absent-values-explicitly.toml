sources = [{ type = "document", ref = "plugins/typescript-ecosystem/agents/typescript-craftsperson.md#type-system-patterns", summary = "The common-mistakes section rejects unjustified non-null assertions and demonstrates handling undefined with a domain error.", confidence = 1.0 }]
