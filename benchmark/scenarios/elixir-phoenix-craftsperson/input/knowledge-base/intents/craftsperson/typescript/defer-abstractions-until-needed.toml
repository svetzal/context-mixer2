sources = [{ type = "document", ref = "plugins/typescript-ecosystem/agents/typescript-craftsperson.md#engineering-principles-your-north-star", summary = "Minimal entities and the self-correction guidance reject abstractions before they are needed.", confidence = 1.0 }]
