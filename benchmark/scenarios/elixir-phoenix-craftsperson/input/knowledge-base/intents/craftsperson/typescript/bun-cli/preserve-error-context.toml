sources = [{ type = "document", ref = "plugins/typescript-ecosystem/agents/typescript-bun-cli-craftsperson.md#error-handling-patterns", summary = "Demonstrates custom CLI and subprocess errors carrying stable codes, command context, and stderr.", confidence = 0.95 }]
