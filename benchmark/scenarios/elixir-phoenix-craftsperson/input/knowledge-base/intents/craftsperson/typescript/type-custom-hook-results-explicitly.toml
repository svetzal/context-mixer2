id = "guidelines.intent.type-custom-hook-results-explicitly"
title = "Give custom hooks explicit result contracts"
category = "design"
tags = ["typescript", "concurrency", "error-handling", "idioms", "language-design", "ecosystem-conventions"]
relations = [
  { type = "specializes", target = "craftsperson/use-language-and-ecosystem-idioms" },
