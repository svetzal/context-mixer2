sources = [{ type = "document", ref = "plugins/typescript-ecosystem/agents/typescript-bun-cli-craftsperson.md#engineering-principles-your-north-star", summary = "Explicitly invokes YAGNI, the simplest thing that could work, and removal of speculative features.", confidence = 1.0 }]
