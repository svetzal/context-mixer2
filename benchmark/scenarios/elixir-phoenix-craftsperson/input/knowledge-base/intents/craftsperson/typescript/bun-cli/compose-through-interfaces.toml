capability = "Behavior can be combined or substituted without inheriting implementation and lifecycle assumptions."
threat = "Class inheritance creates rigid coupling between contracts and shared implementation."
expectation = "CLI capabilities and adapters will need alternative implementations as integrations and environments change."
