status = "hypothesized"
confidence = 0.97
capability = "Defects are caught at the cheapest layer that faithfully exercises the relevant boundary."
threat = "A single test style either misses integration failures or makes all feedback slow and brittle."
expectation = "The application will contain both pure rules and framework or context boundaries."
strategy = "Use fast isolated unit tests for pure functions and integration tests at context boundaries."
evidence = [{ type = "suite_review", description = "Pure rules have infrastructure-free unit tests and context contracts have targeted integration coverage without duplicating the same assertions at every layer.", required = true }]
tradeoff = "Maintainers must decide which layer owns each behavior and support more than one test harness."
