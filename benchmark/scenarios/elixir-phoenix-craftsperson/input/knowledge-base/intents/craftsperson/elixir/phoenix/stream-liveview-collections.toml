id = "guidelines.intent.stream-liveview-collections"
title = "Stream LiveView collections"
category = "design"
tags = ["elixir", "phoenix", "idioms", "language-design", "ecosystem-conventions"]
relations = [
  { type = "specializes", target = "craftsperson/use-language-and-ecosystem-idioms" },
]
status = "hypothesized"
confidence = 0.99
capability = "Long-lived LiveViews can display changing collections without retaining every rendered item in socket assigns."
threat = "Assigning growing collections balloons per-connection memory as data and session duration increase."
expectation = "Production collections and concurrent LiveView connections will grow."
strategy = "Represent rendered collections with LiveView streams and update them through stream operations."
evidence = [{ type = "memory_test", description = "A representative long-running collection update keeps socket memory bounded relative to retained non-stream state.", required = true }]
tradeoff = "Streams are not enumerable and require separate state for counts, filtering, and empty-state decisions."
scope = { project = "guidelines", paths = ["plugins/elixir-ecosystem/agents/elixir-phoenix-craftsperson.md"] }
sources = [{ type = "document", ref = "plugins/elixir-ecosystem/agents/elixir-phoenix-craftsperson.md#liveview-streams", summary = "Requires streams for collections to avoid memory ballooning and documents their non-enumerable limitations.", confidence = 1.0 }]
