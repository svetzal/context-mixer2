id = "guidelines.intent.isolate-functional-core-from-effects"
title = "Isolate the functional core from effects"
category = "architecture"
tags = ["elixir", "concurrency", "testing", "dependencies", "persistence", "functional-core"]
relations = [
  { type = "specializes", target = "craftsperson/isolate-functional-core-from-effects" },
