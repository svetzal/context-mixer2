sources = [{ type = "document", ref = "plugins/elixir-ecosystem/agents/elixir-craftsperson.md#workflow--collaboration", summary = "Makes psychological safety paramount and directs reviewers to critique ideas with curiosity.", confidence = 1.0 }]
