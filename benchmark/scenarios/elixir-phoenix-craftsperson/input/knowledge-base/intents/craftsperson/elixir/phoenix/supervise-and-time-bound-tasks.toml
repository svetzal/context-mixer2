sources = [{ type = "document", ref = "plugins/elixir-ecosystem/agents/elixir-phoenix-craftsperson.md#otp-best-practices", summary = "Prescribes Task.Supervisor, failure handling, and appropriate task timeouts.", confidence = 1.0 }]
