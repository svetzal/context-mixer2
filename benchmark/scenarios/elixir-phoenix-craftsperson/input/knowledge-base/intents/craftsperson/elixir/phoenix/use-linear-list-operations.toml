id = "guidelines.intent.use-linear-list-operations"
title = "Use list operations that respect linked-list structure"
category = "design"
tags = ["elixir", "phoenix", "concurrency", "testing", "domain-modeling", "type-safety"]
relations = [
  { type = "specializes", target = "craftsperson/make-invalid-states-explicit" },
]
status = "hypothesized"
confidence = 0.97
capability = "Sequence processing remains correct and predictably efficient for Elixir linked lists."
threat = "Array-style indexing and repeated tail appends introduce invalid access or quadratic work."
expectation = "Collections will grow beyond the sizes where accidental traversal costs are invisible."
strategy = "Use pattern matching, Enum.at or List functions for access and prepend items rather than repeatedly appending."
evidence = [{ type = "static_check", description = "List code contains no bracket indexing and no repeated list ++ [item] accumulation in growing loops.", required = true }]
tradeoff = "Prepending may require a final reversal and positional access remains linear."
scope = { project = "guidelines", paths = ["plugins/elixir-ecosystem/agents/elixir-phoenix-craftsperson.md"] }
sources = [{ type = "document", ref = "plugins/elixir-ecosystem/agents/elixir-phoenix-craftsperson.md#core-language-patterns", summary = "Forbids index syntax on lists and prefers prepending over tail concatenation.", confidence = 1.0 }]
