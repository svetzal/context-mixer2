status = "hypothesized"
confidence = 0.98
capability = "A requested behavior is made concrete before implementation choices obscure the requirement."
threat = "Implementation begins from assumptions that are never demonstrated as a failing observable example."
expectation = "Requirements will be incomplete and implementation ideas will arrive before edge behavior is settled."
strategy = "Write a failing test first and make it pass with the simplest implementation before refactoring."
evidence = [{ type = "workflow_observation", description = "A new behavior is represented by a test that fails without the implementation and passes after the smallest enabling change.", required = true }]
tradeoff = "Test-first work adds an up-front design step and can feel slower for exploratory changes."
