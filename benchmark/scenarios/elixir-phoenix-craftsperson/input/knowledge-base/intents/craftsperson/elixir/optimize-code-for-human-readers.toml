id = "guidelines.intent.optimize-code-for-human-readers"
title = "Optimize code for the next human reader"
category = "design"
tags = ["elixir", "dependencies", "readability", "clarity", "maintainability"]
relations = [
  { type = "specializes", target = "craftsperson/optimize-code-for-human-readers" },
]
status = "hypothesized"
confidence = 0.98
capability = "Maintainers can infer behavior, contracts, and domain boundaries directly from the code."
threat = "Abbreviated names and opaque structure turn routine changes into archaeology and invite misunderstandings."
expectation = "Future maintainers will modify code without the original author's context."
strategy = "Use intention-revealing names, explicit signatures, and module boundaries that reflect domain concepts."
evidence = [{ type = "review_observation", description = "A focused review can explain changed behavior from names, signatures, and module placement without reconstructing hidden conventions.", required = true }]
tradeoff = "Explicit code can be more verbose and may reject locally concise idioms."
scope = { project = "guidelines", paths = ["plugins/elixir-ecosystem/agents/elixir-craftsperson.md"] }
sources = [{ type = "document", ref = "plugins/elixir-ecosystem/agents/elixir-craftsperson.md#engineering-principles-your-north-star", summary = "Defines code as communication and prioritizes revealing intent for the next reader.", confidence = 1.0 }]
