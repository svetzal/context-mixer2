id = "guidelines.intent.prevent-unbounded-atom-creation"
title = "Prevent unbounded atom creation"
category = "design"
tags = ["elixir", "idioms", "language-design", "ecosystem-conventions"]
relations = [
  { type = "specializes", target = "craftsperson/use-language-and-ecosystem-idioms" },
]
status = "hypothesized"
confidence = 0.99
capability = "The BEAM atom table remains bounded by application-known identifiers."
threat = "Converting arbitrary user strings to atoms permanently consumes atom-table entries and enables denial of service."
expectation = "Public endpoints will receive effectively unlimited distinct strings."
strategy = "Never call String.to_atom/1 on user input; keep values as strings or map against an allowlist of existing atoms."
evidence = [{ type = "security_test", description = "Fuzzing with distinct user strings leaves the atom count stable and static analysis finds no tainted String.to_atom call.", required = true }]
tradeoff = "String keys and explicit allowlist conversion require extra matching and may be less convenient than atom-key APIs."
scope = { project = "guidelines", paths = ["plugins/elixir-ecosystem/agents/elixir-craftsperson.md"] }
sources = [{ type = "document", ref = "plugins/elixir-ecosystem/agents/elixir-craftsperson.md#core-language-patterns", summary = "Forbids String.to_atom/1 on user input because unbounded atom creation can exhaust the VM atom table.", confidence = 1.0 }]
