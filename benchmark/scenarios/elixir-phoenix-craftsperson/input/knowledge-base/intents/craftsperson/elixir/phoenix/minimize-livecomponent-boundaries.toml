sources = [{ type = "document", ref = "plugins/elixir-ecosystem/agents/elixir-phoenix-craftsperson.md#liveview-naming-and-routes", summary = "Advises avoiding LiveComponents unless there is a strong, specific need.", confidence = 1.0 }]
