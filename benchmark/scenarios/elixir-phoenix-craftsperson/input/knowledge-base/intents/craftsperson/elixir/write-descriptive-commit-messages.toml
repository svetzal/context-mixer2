status = "hypothesized"
confidence = 0.96
capability = "Future maintainers can understand why a change entered the history."
threat = "Generic commit subjects erase intent and turn regression archaeology into diff reconstruction."
expectation = "Operational questions and regressions will be investigated after the original context is gone."
strategy = "Describe the concrete behavior or purpose introduced by each commit."
evidence = [{ type = "history_review", description = "Each commit subject names the behavior or purpose of the change without relying on ticket context.", required = true }]
tradeoff = "Crafting precise history takes time and imperfectly summarized commits may still require reading the diff."
