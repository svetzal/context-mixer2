sources = [{ type = "document", ref = "plugins/elixir-ecosystem/agents/elixir-phoenix-craftsperson.md#authentication-with-phxgenauth", summary = "Requires authentication plugs and on-mount sessions at router boundaries for protected routes.", confidence = 1.0 }]
