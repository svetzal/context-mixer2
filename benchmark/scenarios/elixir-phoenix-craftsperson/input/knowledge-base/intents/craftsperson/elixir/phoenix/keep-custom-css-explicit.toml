id = "guidelines.intent.keep-custom-css-explicit"
title = "Keep custom CSS explicit"
category = "design"
tags = ["elixir", "phoenix", "build-and-delivery", "idioms", "language-design", "ecosystem-conventions"]
relations = [
  { type = "specializes", target = "craftsperson/use-language-and-ecosystem-idioms" },
]
status = "hypothesized"
confidence = 0.9
capability = "A custom style's actual CSS behavior remains visible and debuggable at its definition."
threat = "Tailwind @apply hides utility expansion behind build-time indirection and creates opaque coupling to utility configuration."
expectation = "Polished components will need custom CSS alongside Tailwind utilities as the design evolves."
strategy = "Write raw CSS declarations for custom rules instead of composing Tailwind utilities with @apply."
evidence = [{ type = "static_check", description = "Application CSS contains no @apply directives and custom rules expose their declarations directly.", required = true }]
tradeoff = "Raw declarations duplicate values already represented by utilities and can drift from Tailwind design tokens."
scope = { project = "guidelines", paths = ["plugins/elixir-ecosystem/agents/elixir-phoenix-craftsperson.md"] }
sources = [{ type = "document", ref = "plugins/elixir-ecosystem/agents/elixir-phoenix-craftsperson.md#tailwind-css", summary = "Forbids @apply when writing raw CSS; the explicitness rationale is inferred.", confidence = 0.9 }]
