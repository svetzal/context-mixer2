sources = [{ type = "document", ref = "plugins/elixir-ecosystem/agents/elixir-craftsperson.md#core-language-patterns", summary = "Forbids bracket syntax on lists and names pattern matching, Enum.at/2, and List functions as alternatives.", confidence = 1.0 }]
