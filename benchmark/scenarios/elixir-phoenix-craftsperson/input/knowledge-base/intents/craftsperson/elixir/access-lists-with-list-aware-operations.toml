id = "guidelines.intent.access-lists-with-list-aware-operations"
title = "Access lists with list-aware operations"
category = "design"
tags = ["elixir", "dependencies", "domain-modeling", "type-safety", "invariants"]
relations = [
  { type = "specializes", target = "craftsperson/make-invalid-states-explicit" },
