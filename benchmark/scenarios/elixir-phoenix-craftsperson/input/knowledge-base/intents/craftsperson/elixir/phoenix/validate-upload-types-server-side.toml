id = "guidelines.intent.validate-upload-types-server-side"
title = "Validate upload types server-side"
category = "design"
tags = ["elixir", "phoenix", "concurrency", "formatting", "idioms", "language-design"]
relations = [
  { type = "specializes", target = "craftsperson/use-language-and-ecosystem-idioms" },
]
status = "hypothesized"
confidence = 0.99
capability = "Only permitted file formats reach application storage and processing."
threat = "Attackers falsify client MIME metadata or extension checks to upload dangerous content."
expectation = "File-upload endpoints will receive untrusted data from modified or non-browser clients."
strategy = "Validate the actual file type on the server and never trust client-declared MIME information."
evidence = [{ type = "security_test", description = "A file with an allowed client MIME label but disallowed server-detected content is rejected before storage or processing.", required = true }]
tradeoff = "Content inspection adds CPU, dependencies, and false-rejection risk for ambiguous formats."
scope = { project = "guidelines", paths = ["plugins/elixir-ecosystem/agents/elixir-phoenix-craftsperson.md"] }
sources = [{ type = "document", ref = "plugins/elixir-ecosystem/agents/elixir-phoenix-craftsperson.md#file-uploads", summary = "Mandates server-side file-type validation and distrust of client MIME types.", confidence = 1.0 }]
