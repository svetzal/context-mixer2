id = "guidelines.intent.preserve-inward-web-dependency-direction"
title = "Preserve inward web dependency direction"
category = "design"
tags = ["elixir", "phoenix", "testing", "dependencies", "idioms", "language-design"]
relations = [
  { type = "specializes", target = "craftsperson/use-language-and-ecosystem-idioms" },
]
status = "hypothesized"
confidence = 0.99
capability = "Business logic can run and be tested without Phoenix web dependencies."
threat = "Core modules importing web concerns bind domain behavior to one delivery interface and create dependency cycles."
expectation = "Business capabilities may later be reused by jobs, APIs, scripts, or alternate interfaces."
strategy = "Keep contexts, schemas, and workers under the core application namespace, keep web modules under the web namespace, and allow dependencies only from web inward."
evidence = [{ type = "import_boundary", description = "Core modules compile without references to the web namespace, while web modules access business behavior only through core APIs.", required = true }]
tradeoff = "Boundary mapping and context APIs add ceremony for web-only CRUD applications."
scope = { project = "guidelines", paths = ["plugins/elixir-ecosystem/agents/elixir-phoenix-craftsperson.md"] }
sources = [{ type = "document", ref = "plugins/elixir-ecosystem/agents/elixir-phoenix-craftsperson.md#project-structure", summary = "Separates core and web directories and requires dependencies to flow from web to core only.", confidence = 1.0 }]
