strategy = "Compile the test environment with warnings-as-errors before declaring work complete."
evidence = [{ type = "gate", description = "MIX_ENV=test mix compile --warnings-as-errors exits successfully from a clean build.", required = true }]
tradeoff = "Dependency or toolchain warning changes can block delivery before application behavior is affected."
