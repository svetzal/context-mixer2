id = "guidelines.intent.treat-compiler-warnings-as-errors"
title = "Treat compiler warnings as errors"
category = "quality"
tags = ["elixir", "testing", "static-analysis", "error-handling", "build-and-delivery", "warnings"]
relations = [
  { type = "specializes", target = "craftsperson/resolve-static-analysis-findings" },
