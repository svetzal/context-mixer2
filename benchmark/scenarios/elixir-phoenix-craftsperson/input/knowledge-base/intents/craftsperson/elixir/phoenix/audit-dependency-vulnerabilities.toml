status = "hypothesized"
confidence = 0.99
capability = "Known vulnerable dependency versions are detected before release."
threat = "A trusted package version acquires a disclosed vulnerability after adoption."
expectation = "The vulnerability status of dependencies will change independently from application code."
strategy = "Run mix deps.audit and address high- and medium-severity findings immediately while documenting accepted low-severity findings."
evidence = [{ type = "security_gate", description = "mix deps.audit reports no unaddressed high- or medium-severity findings and low-severity exceptions are documented.", required = true }]
tradeoff = "Urgent dependency remediation can force upgrades, compatibility work, or temporary delivery delays."
