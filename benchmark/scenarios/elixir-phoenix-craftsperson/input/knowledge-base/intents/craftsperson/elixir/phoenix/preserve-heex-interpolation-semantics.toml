id = "guidelines.intent.preserve-heex-interpolation-semantics"
title = "Preserve HEEx interpolation semantics"
category = "design"
tags = ["elixir", "phoenix", "error-handling", "idioms", "language-design", "ecosystem-conventions"]
relations = [
  { type = "specializes", target = "craftsperson/use-language-and-ecosystem-idioms" },
]
status = "hypothesized"
confidence = 0.98
capability = "Dynamic values and blocks render in the intended HTML context without compile or escaping errors."
threat = "Using body interpolation in attributes, brace syntax for blocks, or unannotated literal braces produces invalid templates."
expectation = "Templates will mix dynamic attributes, control-flow blocks, and literal code examples."
strategy = "Use braces for attribute and simple body values, EEx interpolation for blocks, and phx-no-curly-interpolation around literal braces."
evidence = [{ type = "compile_gate", description = "HEEx templates compile and targeted rendering tests cover dynamic attributes, block constructs, and literal-brace content.", required = true }]
tradeoff = "Authors must remember context-sensitive syntax and annotate code samples explicitly."
