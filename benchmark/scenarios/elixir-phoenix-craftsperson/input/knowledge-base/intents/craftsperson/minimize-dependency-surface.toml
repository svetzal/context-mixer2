bad = '''
// build.gradle — four new suppliers, one utility call each
implementation 'org.apache.commons:commons-lang3:3.14.0'
implementation 'com.google.guava:guava:33.0.0-jre'
implementation 'commons-io:commons-io:2.15.1'
implementation 'org.modelmapper:modelmapper:3.2.0'

// the actual usage found in the codebase:
//   StringUtils.isBlank(name)  <- s.isBlank() exists
//   Lists.newArrayList()       <- new ArrayList<>() exists
//   IOUtils.toString(in)       <- in.readAllBytes() exists
'''

[examples.kotlin]
good = '''
// need: pad an id to 8 digits for display
fun padId(id: Int): String = id.toString().padStart(8, '0')
// the stdlib already does this; adding a utility library
// for one call would buy a transitive tree, upgrade
// obligations, and CVE surface for zero new capability —
// reviewed and declined in the change description
'''
bad = '''
// build.gradle.kts
dependencies {
    implementation("org.apache.commons:commons-lang3:3.14.0")
    implementation("com.google.guava:guava:33.0.0-jre")
}
// both added for a single call:
fun padId(id: Int): String =
    StringUtils.leftPad(id.toString(), 8, '0')
'''

[examples.python]
good = '''
from datetime import UTC, datetime
from pathlib import Path

def backup_name(source: Path) -> str:
    # stdlib covers this; no new supply-chain surface
    stamp = datetime.now(UTC).strftime("%Y%m%dT%H%M%S")
    return f"{source.stem}-{stamp}.bak"
'''
bad = '''
import arrow          # datetime formatting, once
import inflection     # snake_case a string, once
import shortuuid      # could be uuid4().hex[:8]

def backup_name(source: Path) -> str:
    # three deps (plus transitive trees, CVEs, and upgrade
    # duty) to build one filename
    stamp = arrow.utcnow().format("YYYYMMDDTHHmmss")
    name = inflection.underscore(source.stem)
    return f"{name}-{stamp}-{shortuuid.uuid()[:8]}.bak"
'''

