[examples.typescript]
good = '''
// A three-line local helper beats a transitive subtree.
export const chunk = <T>(xs: T[], size: number): T[][] =>
  xs.length === 0 ? []
    : [xs.slice(0, size), ...chunk(xs.slice(size), size)];

// zod stays: schema validation is maintained capability we
// should not rebuild — rationale recorded in the PR.
'''
