[examples.clojure]
good = '''
;; needed: left-pad an id, capitalize a label
(defn pad-id [id]
  (format "%08d" id))

(defn title-label [s]
  (str/capitalize s))

; solved with clojure.core and the JDK — deps.edn untouched,
; nothing new to audit, upgrade, or trust
'''
bad = '''
;; deps.edn additions for the same two helpers:
{:deps
 {funcool/cuerdas {:mvn/version "2023.11.09-407"}   ; strings
  org.apache.commons/commons-lang3
  {:mvn/version "3.14.0"}                           ; strings
  com.taoensso/encore {:mvn/version "3.98.0"}}}     ; "utils"

; three libraries and their transitive trees on the upgrade
; treadmill — to pad an id and capitalize a label
'''

[examples.cpp]
good = '''
// Need: left-pad an id to 8 chars. The standard library
// already covers it — no new third-party code taken on.
std::string padId(std::string id) {
  if (id.size() < 8)
    id.insert(0, 8 - id.size(), '0');
  return id;
}
// Dependency review note: nothing added; supply-chain
// surface unchanged.
'''
bad = '''
# vcpkg.json — three new dependency trees to pad a string
{ "dependencies": [
    "boost-algorithm",
    "abseil",
    "leftpad-cpp"        // unmaintained since 2019
] }
# each brings transitive code, upgrade constraints, and CVE
# surface; total in-house code replaced: five lines
'''

[examples.csharp]
good = '''
// need: zero-pad ids, slugify titles — the BCL
// already covers both; no package added
var padded = id.PadLeft(8, '0');
var slug = string.Join('-',
    title.ToLowerInvariant().Split(' ',
        StringSplitOptions.RemoveEmptyEntries));
'''
bad = '''
$ git diff App.csproj
+ <PackageReference Include="LeftPad.NET"
+     Version="0.9.1" />  <!-- one call site -->
+ <PackageReference Include="SlugMaster3000"
+     Version="1.0.0-beta2" /> <!-- 1 maintainer,
+                                  last push 2023 -->

var padded = LeftPad.Pad(id, 8);
var slug = SlugMaster.Slug(title);
'''

[examples.elixir]
good = '''
# mix.exs — every dep has a current use and no simpler
# existing alternative
defp deps do
  [
    {:req, "~> 0.5"},    # retries + telemetry we rely on
    {:jason, "~> 1.4"}   # JSON across the whole app
  ]
end

# declined this sprint, with reasons in the PR:
#   :timex — DateTime/Calendar cover our two use sites
#   :uuid  — Ecto.UUID.generate/0 is already here
'''
bad = '''
# mix.exs — a dependency per convenience
defp deps do
  [
    {:left_pad_ex, "~> 0.1"},  # String.pad_leading/3
    {:uuid, "~> 1.1"},         # Ecto.UUID already here
    {:httpoison, "~> 2.0"},    # :req already in tree
    {:poison, "~> 5.0"},       # Jason already in tree
    {:timex, "~> 3.7"}         # used once, for now/0
  ]
end
# five supply chains adopted to avoid five one-liners
'''

[examples.go]
good = '''
// the current need is lowercase-and-hyphenate; the stdlib
// already does it, so no new supply-chain surface is added
func slugify(title string) string {
	s := strings.ToLower(strings.TrimSpace(title))
	return strings.ReplaceAll(s, " ", "-")
}
'''
bad = '''
import (
	// 41 transitive modules, a CVE feed to watch, and an
	// upgrade treadmill — for one lowercase-and-hyphenate call
	"github.com/megacorp/stringtoolkit/v7"
)

func slugify(title string) string {
	return stringtoolkit.New().Lower().Trim().Hyphenate().
		Apply(title)
}
'''

