status = "hypothesized"
confidence = 1.0
capability = "Ability to benefit from Ruby's dynamic facilities without making behavior opaque"
threat = "Metaprogramming hides method definitions and control flow from readers, tools, and debuggers"
expectation = "Ruby's runtime flexibility will continue to make concise metaprogramming tempting"
strategy = "Use metaprogramming sparingly and only when it significantly improves the public interface"
evidence = [{ type = "review", description = "Each metaprogrammed construct documents the interface improvement, has behavior coverage, and is simpler for callers than an explicit alternative", required = true }]
tradeoff = "Avoiding metaprogramming can introduce repetitive explicit code, while justified uses remain harder to trace"
