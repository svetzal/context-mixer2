id = "guidelines.intent.constrain-metaprogramming"
title = "Use metaprogramming only for substantial interface gains"
category = "design"
tags = ["ruby", "idioms", "language-design", "ecosystem-conventions"]
relations = [
  { type = "specializes", target = "craftsperson/use-language-and-ecosystem-idioms" },
