capability = "Ability to preserve database invariants when part of a multi-step operation fails"
threat = "Independent writes can leave partially applied business operations after errors or concurrency conflicts"
expectation = "Rails business workflows will update multiple related records under failure and contention"
strategy = "Wrap multi-step database operations in appropriate transactions"
