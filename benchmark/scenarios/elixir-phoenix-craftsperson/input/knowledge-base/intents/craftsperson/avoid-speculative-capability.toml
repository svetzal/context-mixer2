[examples.typescript]
good = '''
// One exporter is required today; build exactly that.
export async function exportCsv(
  rows: Order[],
): Promise<string> {
  const header = "id,total";
  const lines = rows.map((r) => `${r.id},${r.total}`);
  return [header, ...lines].join("\n");
}
'''
bad = '''
// Registry, options, and formats nobody asked for.
interface Exporter { run(rows: Order[]): Promise<string> }
const registry = new Map<string, Exporter>();
export function registerExporter(key: string, e: Exporter) {
  registry.set(key, e); // only "csv" is ever registered
}
export interface ExportOpts { format?: string; v2?: boolean }
export async function exportAny(
  rows: Order[], opts: ExportOpts,
): Promise<string> {
  return registry.get(opts.format ?? "csv")!.run(rows);
}
'''
