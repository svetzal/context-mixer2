[examples.rust]
good = '''
// the one accepted behavior, implemented directly
pub fn export_csv(rows: &[Row], out: &mut impl Write)
    -> io::Result<()> {
    for row in rows {
        writeln!(out, "{},{}", row.id, row.name)?;
    }
    Ok(())
}
'''
bad = '''
// registry + trait for formats nobody has requested
pub trait Exporter {
    fn export(&self, rows: &[Row]) -> Vec<u8>;
}
pub struct ExporterRegistry {
    by_name: HashMap<String, Box<dyn Exporter>>,
}
impl ExporterRegistry {
    pub fn register(&mut self, n: &str, e: Box<dyn Exporter>) {
        self.by_name.insert(n.into(), e); // only "csv" exists
    }
}
'''

