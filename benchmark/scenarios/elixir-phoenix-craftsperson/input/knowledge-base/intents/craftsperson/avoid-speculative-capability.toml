[examples.go]
good = '''
// the product exports CSV today; that is all the code does
func ExportCSV(ctx context.Context, w io.Writer, r Report) error {
	cw := csv.NewWriter(w)
	for _, row := range r.Rows() {
		if err := cw.Write(row); err != nil {
			return fmt.Errorf("write report row: %w", err)
		}
	}
	cw.Flush()
	return cw.Error()
}
'''
bad = '''
// nobody has asked for anything but CSV
type Exporter interface {
	Export(ctx context.Context, w io.Writer, r Report) error
}

type Registry struct{ byFormat map[string]Exporter }

func (r *Registry) Register(f string, e Exporter) { r.byFormat[f] = e }

// stubs waiting for a future that may never arrive
type XMLExporter struct{}  // TODO
type PDFExporter struct{}  // TODO
type XLSXExporter struct{} // TODO
'''

[examples.java]
good = '''
// exactly the one export the product ships today
final class CsvExporter {
    String export(List<Invoice> invoices) {
        return invoices.stream()
            .map(i -> i.number() + "," + i.total())
            .collect(joining("\n"));
    }
}
'''
bad = '''
// only CSV is required today; the rest is guessed future need
interface ExportStrategy { String export(List<Invoice> in); }

final class ExporterFactory {
    private final Map<Format, ExportStrategy> plugins =
        new HashMap<>();
    void registerPlugin(Format f, ExportStrategy s) {
        plugins.put(f, s);           // zero callers
    }
    ExportStrategy forFormat(Format f, boolean async,
                             int retries) {  // knobs nobody set
        return plugins.getOrDefault(f, new CsvStrategy());
    }
}
'''

