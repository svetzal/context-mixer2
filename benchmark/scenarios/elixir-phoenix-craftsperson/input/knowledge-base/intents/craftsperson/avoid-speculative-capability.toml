[examples.clojure]
good = '''
(defn export-csv [rows]
  (->> rows
       (map #(str/join "," ((juxt :id :name :total) %)))
       (str/join "\n")))

(deftest exports-billing-rows-as-csv
  (is (= "1,Ada,90"
         (export-csv [{:id 1 :name "Ada" :total 90}]))))
; exactly the accepted requirement: CSV export, nothing more
'''
bad = '''
(defmulti export
  ; only CSV was ever requested; the rest is "for later"
  (fn [format _rows] format))

(defmethod export :csv [_ rows] (rows->csv rows))
(defmethod export :xml [_ rows] (rows->xml rows))  ; no caller
(defmethod export :edn [_ rows] (pr-str rows))     ; no caller
(defmethod export :pdf [_ _] (throw (ex-info "TODO" {})))

(def config {:export/formats [:csv :xml :edn :pdf]
             :export/plugin-dir "plugins/"})       ; unused
'''

