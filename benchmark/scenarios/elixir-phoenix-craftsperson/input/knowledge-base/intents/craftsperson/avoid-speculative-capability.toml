id = "guidelines.intent.avoid-speculative-capability"
title = "Avoid speculative capability"
category = "design"
tags = ["yagni", "scope-control", "maintainability"]
status = "hypothesized"
confidence = 0.99
capability = "The product and codebase stay focused on behavior with demonstrated value."
threat = "Hypothetical future needs add paths, configuration, extension points, and maintenance obligations that may never be used."
expectation = "Ideas about possible future requirements will outnumber validated needs."
strategy = "Build only capability required by current accepted behavior and remove unused speculative machinery."
evidence = [{ type = "scope_review", description = "Every added feature and extension point maps to a current requirement, observed variation, or failing behavioral test.", required = true }]
tradeoff = "A later requirement may require revisiting the design instead of activating a prebuilt extension."
scope = { project = "guidelines", paths = ["plugins/cpp-qt-ecosystem/agents/cpp-qt-craftsperson.md", "plugins/elixir-ecosystem/agents/elixir-craftsperson.md", "plugins/go-ecosystem/agents/go-craftsperson.md", "plugins/typescript-ecosystem/agents/typescript-craftsperson.md"] }
sources = [{ type = "document", ref = "plugins/cpp-qt-ecosystem/agents/cpp-qt-craftsperson.md#engineering-principles-your-north-star", summary = "Applies YAGNI and rejects speculative capability.", confidence = 1.0 }, { type = "document", ref = "plugins/go-ecosystem/agents/go-craftsperson.md#engineering-principles-you-follow", summary = "Builds only capabilities required now.", confidence = 1.0 }, { type = "document", ref = "plugins/typescript-ecosystem/agents/typescript-craftsperson.md#engineering-principles-your-north-star", summary = "Rejects capabilities that are not currently needed.", confidence = 1.0 }]

