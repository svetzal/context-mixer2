Before implementing, one decision is needed:
  a) round half-up per line item (matches EU paper invoices)
  b) round the summed total once (matches current golden files)
These differ by up to 0.04 EUR per invoice.
I recommend (b) — it preserves existing reconciliations.

PM: agreed, (b). Please note it in Billing/README.
-> decision recorded, then implementation begins
'''
