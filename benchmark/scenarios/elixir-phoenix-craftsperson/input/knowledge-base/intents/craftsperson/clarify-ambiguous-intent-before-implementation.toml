[examples.ruby]
good = '''
Ticket: "Expire stale carts."

Dev comment: "Stale" is ambiguous — two readings:
  a) no items added for 30 days
  b) created 30+ days ago, regardless of activity
(a) matches the retention email copy. Confirming before
I implement.

PM: Correct, (a). Ticket updated.

Spec: it "expires carts idle 30 days, keeps old active carts"
'''
bad = '''
Ticket: "Expire stale carts."

# dev resolves the ambiguity silently and codes the guess
def stale?(cart)
  cart.created_at < 30.days.ago # "stale" assumed to mean "old"
end

Commit: "Implement stale cart expiry as discussed"
# no discussion happened; active carts now vanish nightly
