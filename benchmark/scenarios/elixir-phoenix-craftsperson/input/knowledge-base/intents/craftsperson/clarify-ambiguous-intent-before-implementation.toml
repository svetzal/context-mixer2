[examples.typescript]
good = '''
Task: "Expire idle sessions after 30 minutes."

Question raised before implementing:
"Idle" could mean no HTTP requests, or no user input.
  Option A: server-side last-request timestamp — simpler,
    but a long upload counts as idle and logs the user out.
  Option B: client heartbeat on input — covers uploads,
    needs a new endpoint and client work.
Recommend A unless uploads matter. Which is intended?
'''
bad = '''
Task: "Expire idle sessions after 30 minutes."

// Picked a meaning without asking; the guess is now code.
const IDLE_MS = 30 * 60 * 1000;
export const isIdle = (s: Session): boolean =>
  Date.now() - s.lastRequestAt > IDLE_MS;

// Long uploads now log users out mid-transfer.
// Nobody decided that — it was assumed.
'''
