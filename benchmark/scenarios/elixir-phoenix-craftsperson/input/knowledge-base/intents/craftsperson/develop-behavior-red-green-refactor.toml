$ dotnet test
  Passed! 214 tests
'''
bad = '''
// written after the implementation, never seen red
[Fact]
public void Applies_bulk_discount()
{
    var policy = new PricingPolicy();
    var total = policy.Total(units: 10, price: 10m);
    total.Should().Be(policy.Total(10, 10m));
    // compares the code to itself — passes for any
    // answer, including a missing discount
}
'''

[examples.elixir]
good = '''
$ mix test test/cart_test.exs      # red first, on purpose
  1) test "empty cart totals to zero"
     ** (UndefinedFunctionError) Cart.total/1

# smallest coherent change to green:
def total(%Cart{items: []}), do: Money.zero()

$ mix test test/cart_test.exs      # green — now refactor
  1 test, 0 failures
'''
bad = '''
# implementation written first; test added afterwards,
# asserting whatever the code already happens to return
def total(%Cart{items: items}),
  do: Enum.sum_by(items, & &1.price)

test "total works" do
  # never seen red — passes even if the rule is wrong
  assert Cart.total(cart) == Cart.total(cart)
end
'''

[examples.go]
good = '''
