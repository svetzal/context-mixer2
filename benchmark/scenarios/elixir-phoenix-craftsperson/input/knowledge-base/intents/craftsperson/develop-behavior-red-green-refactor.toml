bad = '''
// implementation shipped first; test written after, never
// observed failing
@Test void discountWorks() {
    var expected = pricing.discountFor(new Customer(65));

    var actual = pricing.discountFor(new Customer(65));

    assertEquals(expected, actual);
    // asserts the code against itself — green for ANY
    // behavior, including the wrong one
}
'''

