[examples.java]
good = '''
$ git log --oneline -3
c41d9aa refactor: extract SENIOR_AGE constant (suite green)
b32c815 feat: senior discount at 65 (test passes)
a17f204 test: seniorDiscountAppliesAt65
        (ran red first: expected 0.10, got 0.00 —
