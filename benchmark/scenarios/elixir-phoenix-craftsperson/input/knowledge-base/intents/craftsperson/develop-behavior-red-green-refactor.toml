[examples.typescript]
good = '''
// 1. Red — ran first, failed: applyLateFee did not exist.
it("adds a 5% late fee after the due date", () => {
  const invoice = { total: 100, dueDate: past };
  expect(applyLateFee(invoice, today).total).toBe(105);
});

// 2. Green — smallest coherent change that passes.
export const applyLateFee = (inv: Invoice, on: Date): Invoice =>
  on > inv.dueDate ? { ...inv, total: inv.total * 1.05 } : inv;

// 3. Refactor freely; the test stays green throughout.
'''
bad = '''
// Implementation first; the test came after and asserts
// whatever the code already does. It has never failed.
export const applyLateFee = (inv: Invoice, on: Date): Invoice =>
  on > inv.dueDate ? { ...inv, total: inv.total * 1.05 } : inv;

it("applyLateFee", () => {
  const inv = { total: 100, dueDate: past };
  const actual = applyLateFee(inv, today);
  // passes for the wrong reason — compares code to itself
  expect(actual).toEqual(applyLateFee(inv, today));
});
'''
