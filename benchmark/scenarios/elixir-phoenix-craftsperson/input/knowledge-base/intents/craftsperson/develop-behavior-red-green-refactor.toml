id = "guidelines.intent.develop-behavior-red-green-refactor"
title = "Develop behavior through red-green-refactor"
category = "testing"
tags = ["tdd", "red-green-refactor", "behavior"]
status = "hypothesized"
confidence = 0.99
capability = "Each behavior change begins with executable evidence and finishes with a safe opportunity to improve its design."
threat = "Implementation precedes a falsifiable expectation, allowing tests to pass for the wrong reason or omit the requested behavior."
expectation = "Frequent changes need fast feedback that distinguishes missing behavior from regression and refactoring."
strategy = "Write a decisively failing behavior test, make it pass with the smallest coherent change, then refactor while keeping it green."
evidence = [{ type = "test_history", description = "The new test demonstrably fails without the behavior, passes with it, and protects subsequent refactoring.", required = true }]
tradeoff = "Strict test-first work can feel slow during exploration when the desired behavior is still being discovered."
scope = { project = "guidelines", paths = ["plugins/cpp-qt-ecosystem/agents/cpp-qt-craftsperson.md", "plugins/go-ecosystem/agents/go-craftsperson.md", "plugins/ruby-ecosystem/agents/ruby-craftsperson.md", "plugins/rust-ecosystem/agents/rust-craftsperson.md"] }
sources = [{ type = "document", ref = "plugins/cpp-qt-ecosystem/agents/cpp-qt-craftsperson.md#engineering-principles-your-north-star", summary = "Clarifies behavior through red-green testing.", confidence = 1.0 }, { type = "document", ref = "plugins/ruby-ecosystem/agents/ruby-craftsperson.md#when-implementing-features", summary = "Drives new behavior through red, green, and refactor.", confidence = 1.0 }, { type = "document", ref = "plugins/rust-ecosystem/agents/rust-craftsperson.md#engineering-practices", summary = "Treats tests as executable specifications and uses red-green-refactor.", confidence = 1.0 }]

# --- code examples (rendered by the intent atlas; managed by site/merge_examples.py) ---

[examples.clojure]
good = '''
;; 1. red — written first, watched fail:
(deftest applies-bulk-discount-at-ten-units
  (is (= 90.0 (line-total {:price 10.0 :qty 10}))))
;; => FAIL: expected 90.0, actual 100.0

;; 2. green — smallest coherent change:
(defn line-total [{:keys [price qty]}]
  (cond-> (* price qty) (>= qty 10) (* 0.9)))

;; 3. refactor under the green bar: extracted bulk-rate;
;;    the test is unchanged and still passing
'''
bad = '''
(defn line-total [{:keys [price qty]}]
  (cond-> (* price qty) (>= qty 10) (* 0.9)))

(deftest line-total-test
  ; written afterwards; asserts whatever the code produced
  ; and was never observed failing — a wrong 0.9 also "passes"
  (is (= (line-total {:price 10.0 :qty 10})
         (line-total {:price 10.0 :qty 10}))))
'''

[examples.cpp]
good = '''
// Step 1 (red): committed failing — expired card must decline.
TEST(Charge, DeclinesExpiredCard) {
  auto result = charge(cardExpired(), Money{50});
  EXPECT_EQ(result.error(), Err::CardExpired);
}
// Step 2 (green): smallest change in charge() makes it pass.
// Step 3 (refactor): merged duplicate expiry checks while the
// test stayed green. History shows fail -> pass -> still pass.
'''
bad = '''
Result charge(const Card& c, Money m) { /* written first */ }

// Test added afterwards; never once observed failing.
TEST(Charge, DeclinesExpiredCard) {
  auto result = charge(cardExpired(), Money{50});
  EXPECT_TRUE(result.ok() || !result.ok());  // always passes
}
// Delete the expiry check entirely: suite is still green,
// so the test protects nothing and proves nothing.
'''

[examples.csharp]
good = '''
