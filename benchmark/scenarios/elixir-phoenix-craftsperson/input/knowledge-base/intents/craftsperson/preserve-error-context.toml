id = "guidelines.intent.preserve-error-context"
title = "Preserve actionable error context"
category = "reliability"
tags = ["error-handling", "diagnostics", "observability"]
relations = [
  { type = "related-to", target = "craftsperson/model-recoverable-errors-explicitly" },
]
status = "hypothesized"
confidence = 0.96
capability = "A failure can be diagnosed at its handling boundary without reproducing it or losing its original cause."
threat = "Errors are swallowed, flattened, or reworded without operation, input, or causal context."
expectation = "Failures will cross abstraction boundaries and be investigated far from where they originated."
strategy = "Add boundary-relevant context while retaining stable error identity and the original cause."
evidence = [{ type = "failure_test", description = "Representative failures expose both actionable boundary context and their underlying cause or identity.", required = true }]
tradeoff = "Additional context can expose sensitive values or create noisy error chains unless data is selected carefully."
scope = { project = "guidelines", paths = ["plugins/go-ecosystem/agents/go-craftsperson.md", "plugins/typescript-ecosystem/agents/typescript-bun-cli-craftsperson.md", "plugins/typescript-ecosystem/agents/typescript-craftsperson.md", "plugins/python-ecosystem/agents/python-craftsperson.md"] }
sources = [{ type = "document", ref = "plugins/go-ecosystem/agents/go-craftsperson.md#error-handling-patterns", summary = "Wraps errors with operation context while preserving identity.", confidence = 1.0 }, { type = "document", ref = "plugins/typescript-ecosystem/agents/typescript-bun-cli-craftsperson.md#error-handling-patterns", summary = "Preserves actionable error context at CLI and subprocess boundaries.", confidence = 1.0 }, { type = "document", ref = "plugins/typescript-ecosystem/agents/typescript-craftsperson.md#nodejs-patterns", summary = "Preserves causes across asynchronous error boundaries.", confidence = 1.0 }]

# --- code examples (rendered by the intent atlas; managed by site/merge_examples.py) ---

[examples.clojure]
good = '''
(defn import-row [row-num row]
  (try
    (parse-order row)
    (catch Exception e
      (throw (ex-info "order import failed"
                      {:row   row-num
                       :sku   (get row "sku")
                       :stage :parse}
                      e)))))   ; original cause preserved
'''
bad = '''
(defn import-row [_row-num row]
  (try
    (parse-order row)
    (catch Exception _
      ; cause, row number, and offending input all discarded
      (throw (Exception. "import failed")))))

; ops sees "import failed" 4,000 times with no way to know
; which row, which field, or the underlying parse error
'''

[examples.cpp]
good = '''
try {
  return parseManifest(readFile(path));
} catch (const std::exception&) {
  std::throw_with_nested(              // keeps original cause
      ManifestError("loading manifest " + path.string()));
}
// The handling boundary can render the whole chain:
//   ManifestError: loading manifest plugins/audio.toml
//   caused by: toml parse error at line 12: expected value
'''
bad = '''
try {
  return parseManifest(readFile(path));
} catch (...) {
  return std::nullopt;   // which file? which line? gone.
}
// Three layers up, users see only "manifest missing".
// Support's playbook is now "re-run it under strace" —
// the failure must be reproduced to be diagnosed at all.
'''

[examples.csharp]
good = '''
try
{
    return await _rates.FetchAsync(province, ct);
}
catch (HttpRequestException ex)
{
    // boundary context added, original cause kept
    throw new RateLookupException(
        $"tax-rate fetch failed for {province}", ex);
}
'''
bad = '''
try
{
    return await _rates.FetchAsync(province, ct);
}
catch (Exception)
{
    // swallows the cause, the operation, the input
    throw new Exception("error");
}
'''

[examples.elixir]
good = '''
def import(path) do
  case File.read(path) do
    {:ok, data} ->
      parse(data)

    {:error, reason} ->
      # boundary context added, original cause retained
      {:error, {:import_read_failed, path, reason}}
  end
end

# log shows: {:import_read_failed, "feeds/eu.csv",
#             :enoent} — diagnosable without reproducing
'''
bad = '''
def import(path) do
  case File.read(path) do
    {:ok, data} ->
      parse(data)

    {:error, _reason} ->
      # cause discarded: :enoent, :eacces, and a full
      # disk all collapse into the same story
      {:error, "import failed"}
  end
end
'''

[examples.go]
good = '''
func loadConfig(path string) (*Config, error) {
	b, err := os.ReadFile(path)
	if err != nil {
		return nil, fmt.Errorf("load config %s: %w", path, err)
	}
	var c Config
	if err := json.Unmarshal(b, &c); err != nil {
		return nil, fmt.Errorf("parse config %s: %w", path, err)
	}
	return &c, nil
}

// errors.Is(err, os.ErrNotExist) still works at the boundary
'''
bad = '''
func loadConfig(path string) (*Config, error) {
	b, err := os.ReadFile(path)
	if err != nil {
		return nil, errors.New("config error") // cause discarded
	}
	var c Config
	if json.Unmarshal(b, &c) != nil {
		return nil, nil // failure swallowed entirely
	}
	return &c, nil
}

// on-call sees "config error": which file? missing? denied?
'''

[examples.java]
good = '''
Config load(Path path) {
    try {
        return parse(Files.readString(path));
    } catch (IOException | ParseException e) {
        throw new ConfigLoadException(
            "cannot load config %s".formatted(path), e);
        //   boundary context added ^      cause kept ^
    }
}
// log shows: cannot load config /etc/app/prod.yaml
//   caused by: ParseException: bad indent at line 12
'''
bad = '''
Config load(Path path) {
    try {
        return parse(Files.readString(path));
    } catch (Exception e) {
        // which file? which line? caused by what? gone.
        throw new RuntimeException("config error");
    }
}
// on-call at 3 a.m. sees "config error" and must
// reproduce the failure just to learn which file broke
'''

[examples.kotlin]
good = '''
fun loadConfig(path: Path): Config =
    try {
        parseConfig(path.readText())
    } catch (e: SerializationException) {
        // boundary context added, original cause retained
        throw ConfigError("invalid config at $path", cause = e)
    }
'''
bad = '''
fun loadConfig(path: Path): Config =
    try {
        parseConfig(path.readText())
    } catch (e: Exception) {
        log.warn("config problem")      // which file? why?
        throw RuntimeException("error") // cause discarded
    }
// on-call sees "error" with a stack that starts here — the
// parse failure and the file name are gone for good
'''

[examples.python]
good = '''
def load_profile(path: Path) -> Profile:
    try:
        return Profile.model_validate_json(path.read_text())
    except (OSError, ValidationError) as exc:
        # boundary context added, original cause retained
        raise ProfileLoadError(
            f"cannot load profile from {path}") from exc

# log shows ProfileLoadError: cannot load profile from
# /etc/app/p.json, chained above the causal ValidationError
'''
bad = '''
def load_profile(path: Path) -> Profile:
    try:
        return Profile.model_validate_json(path.read_text())
    except Exception:
        raise RuntimeError("failed")   # which file? why?
        # cause and traceback discarded; diagnosis now
        # requires reproducing the failure in production
'''

[examples.ruby]
good = '''
def import(path:)
  parse(path)
rescue CSV::MalformedCSVError => e
  # boundary context added; Ruby chains e as #cause here
  raise ImportError,
        "import failed: #{path}, line #{e.line_number}"
end

# log shows what failed, where, and the original cause chain
'''
bad = '''
def import(path:)
  parse(path)
rescue StandardError
  # swallowed and flattened — no path, no line, no cause
  raise "import failed"
end

# log output: "import failed" — which file? why? reproduce how?
'''

[examples.rust]
good = '''
#[derive(Debug, thiserror::Error)]
pub enum ConfigError {
    #[error("failed to read config at {path}")]
    Read { path: PathBuf, #[source] cause: io::Error },
    #[error("invalid config: {0}")]
    Parse(#[from] toml::de::Error),
}
pub fn load(path: &Path) -> Result<Config, ConfigError> {
    let raw = fs::read_to_string(path).map_err(|cause| {
        ConfigError::Read { path: path.into(), cause }
    })?; // path added, original cause retained
    Ok(toml::from_str(&raw)?)
}
'''
bad = '''
pub fn load(path: &Path) -> Result<Config, String> {
    let raw = match fs::read_to_string(path) {
        Ok(r) => r,
        // which file? permissions or missing? all gone
        Err(_) => return Err("config error".into()),
    };
    toml::from_str(&raw).map_err(|_| "config error".into())
}
'''

[examples.swift]
good = '''
struct ConfigError: Error {
    let path: String
    let underlying: any Error   // original cause retained
}

func loadConfig(at url: URL) throws -> Config {
    do {
        let data = try Data(contentsOf: url)
        return try JSONDecoder().decode(Config.self, from: data)
    } catch {
        throw ConfigError(path: url.path, underlying: error)
    }
}
'''
bad = '''
func loadConfig(at url: URL) throws -> Config {
    do {
        let data = try Data(contentsOf: url)
        return try JSONDecoder().decode(Config.self, from: data)
    } catch {
        // which file? read or decode? cause discarded
        throw AppError.somethingWentWrong
    }
}
'''

