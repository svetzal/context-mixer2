status = "hypothesized"
confidence = 0.99
capability = "QObject trees are destroyed once as Qt expects."
threat = "Competing smart-pointer and parent owners double-delete."
expectation = "Objects will be reparented and destroyed through Qt."
strategy = "Use the parent as owner and never unique_ptr for parented QObjects."
evidence = [{ type = "gate", description = "No smart pointer owns a parented QObject.", required = true }]
tradeoff = "Raw pointers make ownership less obvious to non-Qt readers."
