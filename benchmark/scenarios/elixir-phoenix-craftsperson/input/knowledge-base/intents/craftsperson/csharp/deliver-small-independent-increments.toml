capability = "Each change can be understood, validated, reverted, and integrated independently."
threat = "Large mixed changes hide defects, compound review uncertainty, and make rollback unsafe."
expectation = "Concurrent work and changing requirements will increase the cost of long feedback cycles."
strategy = "Work in small safe increments and record each single logical reason as an atomic commit."
