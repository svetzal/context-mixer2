status = "hypothesized"
confidence = 0.99
capability = "External systems can be replaced, simulated, or unavailable without contaminating the domain model."
threat = "Direct database, API, file-system, and HTTP dependencies spread vendor-specific details through application code."
expectation = "External services and libraries will change contracts, implementations, and availability over time."
strategy = "Route every external interaction through a focused application-owned gateway interface."
evidence = [{ type = "import_boundary", description = "Only gateway adapters depend on external client or persistence libraries, and core code refers to application-owned contracts.", required = true }]
tradeoff = "Gateway interfaces and adapters add code, indirection, and mapping around otherwise direct library calls."
