sources = [{ type = "document", ref = "plugins/dotnet-ecosystem/agents/csharp-craftsperson.md#when-quality-gates-fail", summary = "Requires stopping, fixing root causes, rerunning all checks, and documenting and consulting on exceptions.", confidence = 1.0 }]
