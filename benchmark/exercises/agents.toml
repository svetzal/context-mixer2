# The cross-driver control. Going wide over models changes the driver too —
# Claude Code, codex, and opencode differ in system prompt, tool set, and loop
# behaviour — so a gap between `claude-sonnet-5` and `opencode-qwen3_6-27b`
# confounds the model with the harness driving it. Running a hosted model
# through opencode holds the driver constant, which is what makes the local
# comparison a claim about models.
[agents.opencode-claude-sonnet-5]
description = "opencode, Claude Sonnet 5 (cross-driver control for the local models)"
command = [
    "opencode", "run",
    "--pure",
    "--auto",
    "--format", "json",
    "--model", "anthropic/claude-sonnet-5",
    "--dir", "{workspace}",
    "{prompt}",
]
guidance_files = ["AGENTS.md"]
telemetry = "opencode-jsonl"
isolation_notes = [
    "--pure runs without external plugins",
    "OPENCODE_CONFIG points at the harness provider declaration, not the operator's global config",
    "same driver as the local-model agents, so a difference against them is the model",
]
[agents.opencode-claude-sonnet-5.env]
OPENCODE_CONFIG = "{here}/opencode-config.json"
