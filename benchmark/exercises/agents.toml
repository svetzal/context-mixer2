# Agent and model parameters — the first of the harness's three inputs.
#
# `command` is argv. `{prompt}` is replaced with the task prompt and `{workspace}`
# with the absolute workspace path. `guidance_files` names where this agent reads
# project guidance from; the assembled cmf artifact is written to each of them.
# `env` is layered onto the inherited environment, with `{here}` resolving to
# this directory.
#
# ## Each model runs on the driver that bills it correctly
#
# Anthropic models run under Claude Code and OpenAI models under Codex, because
# both authenticate against a subscription rather than per-token API keys
# (`~/.codex/auth.json` reports `auth_mode: chatgpt`; Claude Code uses its own
# OAuth, and no API key is set in the environment). Routing either family
# through a third-party client would move the same work onto metered API
# billing. opencode is used *only* for local ollama weights, which are free at
# the margin.
#
# The `cost_usd` a trial records is therefore notional for the hosted models —
# the API-equivalent price of those tokens, not money billed. The real
# constraint on a large sweep is subscription rate limits, not dollars.
#
# ## Ambient configuration
#
# A globally installed CLAUDE.md, a user AGENTS.md, or an installed skill can
# carry the same advice the exercise is trying to attribute to the assembled
# slice. It is present in both arms, so it cannot invent a difference between
# them — but it does raise the control arm's floor and so understates lift.
# `home_env` names the variable that relocates an agent's configuration home;
# the runner only sets it under `--isolate-agent-home`, because an empty home
# also drops credentials that live there rather than in the system keychain.
#
# ## Local models
#
# `max_concurrency` clamps `--concurrency`. One ollama instance cannot serve
# parallel trials against 18-81 GB weights; two trials wanting different models
# would measure eviction rather than the models. `warmup` sends one throwaway
# request first, because a cold model takes minutes to load and would otherwise
# consume trial one's timeout before inference starts.

# --------------------------------------------------------------------------
# Anthropic — Claude Code (subscription)
#
# Every id below was probed live and confirmed served rather than silently
# rerouted; `served_requested` in each trial's telemetry re-checks that per run.
# --------------------------------------------------------------------------

[agents.claude-opus-5]
description = "Claude Code, Opus 5"
command = ["claude", "--print", "--output-format", "json", "--model", "claude-opus-5", "--permission-mode", "bypassPermissions", "--setting-sources", "project", "--no-session-persistence", "--disable-slash-commands", "{prompt}"]
guidance_files = ["AGENTS.md", "CLAUDE.md"]
home_env = "CLAUDE_CONFIG_DIR"
telemetry = "claude-json"
isolation_notes = ["--setting-sources project excludes user and local settings files", "--disable-slash-commands excludes installed skills"]
[agents.claude-opus-5.env]
CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC = "1"

