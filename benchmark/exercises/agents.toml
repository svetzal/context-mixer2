# --------------------------------------------------------------------------
# Local weights — opencode against ollama (free at the margin)
#
# opencode is used here and nowhere else. OPENCODE_CONFIG points at this
# directory's provider declaration, so the harness names the models it needs and
# the operator's global opencode config is neither read nor modified — which is
# also the only way to reach a model opencode's own catalog does not list.
# --------------------------------------------------------------------------

[agents.opencode-qwen3_6-27b]
description = "opencode, local Qwen3.6 27B Coder (mxfp8) via ollama"
command = ["opencode", "run", "--pure", "--auto", "--format", "json", "--model", "ollama/qwen3.6:27b-coding-mxfp8", "--dir", "{workspace}", "{prompt}"]
guidance_files = ["AGENTS.md"]
telemetry = "opencode-jsonl"
max_concurrency = 1
warmup = true
isolation_notes = ["--pure runs without external plugins", "OPENCODE_CONFIG points at the harness provider declaration, not the operator's global config"]
[agents.opencode-qwen3_6-27b.env]
OPENCODE_CONFIG = "{here}/opencode-config.json"

[agents.opencode-qwen3_5-122b]
description = "opencode, local Qwen3.5 122B via ollama"
