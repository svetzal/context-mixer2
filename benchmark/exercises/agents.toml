# --------------------------------------------------------------------------
# OpenAI — Codex (ChatGPT subscription)
#
# Model ids come from `~/.codex/models_cache.json`. There is no bare `gpt-5.6`:
# sol, terra, and luna are the 5.6 variants, and an earlier `--model gpt-5.6`
# entry here would have failed on first use.
# --------------------------------------------------------------------------

[agents.codex-gpt-5-6-sol]
description = "Codex CLI, GPT-5.6 sol"
command = ["codex", "exec", "--json", "--model", "gpt-5.6-sol", "--cd", "{workspace}", "--sandbox", "workspace-write", "--skip-git-repo-check", "--ignore-user-config", "--ignore-rules", "--ephemeral", "{prompt}"]
guidance_files = ["AGENTS.md"]
home_env = "CODEX_HOME"
telemetry = "codex-jsonl"
isolation_notes = ["--ignore-user-config skips $CODEX_HOME/config.toml", "--ignore-rules skips user and project execpolicy rules", "--ephemeral keeps session files off disk"]

[agents.codex-gpt-5-6-terra]
