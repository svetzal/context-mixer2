status = "hypothesized"
confidence = 0.99
capability = "Type annotations remain concise and have consistent runtime semantics across the supported Python environment."
threat = "Legacy typing aliases and postponed-annotation compatibility layers create parallel syntax and subtle runtime differences."
expectation = "The project will target Python 3.11 or newer rather than carrying support for older interpreters."
strategy = "Use built-in generics and `|` unions, reject legacy `typing` collection aliases, and avoid `from __future__ import annotations`."
