[examples.rust]
good = '''
// the decision is pure; no I/O can reach it
pub fn overdue(invoices: &[Invoice], today: Date) -> Vec<Id> {
    invoices.iter()
        .filter(|i| i.due < today && !i.paid)
        .map(|i| i.id)
        .collect()
}
// a thin shell owns every effect
pub fn run(db: &Db, clock: &impl Clock) -> Result<(), AppErr> {
    let ids = overdue(&db.load_invoices()?, clock.today());
    db.mark_overdue(&ids)
}
#[test]
fn flags_unpaid_past_due() { /* no db, no clock, no sleep */ }
'''
bad = '''
// decision logic interleaved with db, clock, and smtp —
// the rule cannot be tested without all three
pub fn process_overdue(conn: &mut PgConn) -> Result<(), Err> {
    let today = chrono::Utc::now().date_naive(); // hidden clock
    for row in conn.query(SELECT_INVOICES, &[])? {
        let inv = Invoice::from_row(&row)?;
        if inv.due < today && !inv.paid {
            conn.execute(MARK_OVERDUE, &[&inv.id])?;
            send_email(&inv.customer_email)?;
        }
    }
    Ok(())
}
'''

[examples.swift]
good = '''
// Pure decision: deterministic, testable with values alone.
func renewalDate(for plan: Plan, from now: Date) -> Date {
    now.addingTimeInterval(plan.period)
}

// Thin shell owns clock, network, and persistence.
func processRenewal(_ sub: Subscription) async throws {
    let plan = try await api.fetchPlan(sub.planID)
    let due = renewalDate(for: plan, from: clock.now)
    try await store.save(sub.renewed(on: due))
}
'''
bad = '''
func renewalDate(for sub: Subscription) async throws -> Date {
    // clock, network, and logging inside the decision
    let now = Date()
    let plan = try await api.fetchPlan(sub.planID)
    try db.append("renewal computed for \(sub.id)")
    return now.addingTimeInterval(plan.period)
}
// testing this one rule now needs a live API and database
'''

[examples.typescript]
good = '''
// Core: pure decision, testable with plain values.
export const priceAfterDiscount = (
  subtotal: number, tier: Tier, now: Date,
): number =>
  tier === "gold" && isQ4(now) ? subtotal * 0.9 : subtotal;

// Shell: gathers effects, calls the core, persists.
export async function quote(orderId: string): Promise<void> {
  const order = await repo.load(orderId);
  const total = priceAfterDiscount(
    order.subtotal, order.tier, clock.now());
  await repo.saveQuote(orderId, total);
}
'''
