[examples.clojure]
good = '''
;; core: pure decision — no I/O, no clock
(defn renewal-decision [{:keys [paid-through rate]} today]
  (if (neg? (compare paid-through today))
    {:action :suspend}
    {:action :renew :charge rate}))

(deftest suspends-lapsed-subscription   ; runs with no infra
  (is (= {:action :suspend}
         (renewal-decision {:paid-through "2026-01-01"}
                           "2026-02-01"))))
;; thin shell elsewhere: fetch sub, call decision, run effects
'''
bad = '''
(defn process-renewal! [id]
  (let [sub (jdbc/execute-one!
             db ["select * from subs where id = ?" id])
        today (java.time.LocalDate/now)]   ; hidden clock
    (if (.isBefore (:subs/paid_through sub) today)
      (jdbc/execute!
       db ["update subs set state = 'suspended' where id = ?" id])
      (charge-card! (:subs/card sub) (:subs/rate sub)))))
; the renewal rule cannot be tested without a database, a
; card processor, and control of the system clock
'''

[examples.cpp]
good = '''
// Core: pure decision — tests need no DB, clock, or network.
Discount discountFor(const Cart& cart, LocalDate today) {
  if (cart.total() > Money{200} && today.isWeekend())
    return Discount::percent(10);
  return Discount::none();
}
// Shell: gathers effects, then delegates the decision.
void applyDiscount(CartId id) {
  auto cart = repo_.load(id);            // I/O lives here only
  repo_.store(id, discountFor(cart, clock_.today()));
}
'''
bad = '''
Discount discountFor(CartId id) {
  QSqlQuery q("SELECT total FROM carts WHERE id = ?");  // I/O
  q.addBindValue(id.value());
  q.exec();
  q.next();
  auto today = QDate::currentDate();     // hidden ambient clock
  if (q.value(0).toInt() > 200 && today.dayOfWeek() >= 6)
    return Discount::percent(10);   // rule buried in plumbing
  return Discount::none();
}
// testing "weekend discount" now needs a database and Saturday
'''

