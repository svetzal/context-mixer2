[examples.elixir]
good = '''
# core: pure decision — tested with plain data, no infra
defmodule Billing.Core do
  def late_fee(invoice, today) do
    if Date.after?(today, invoice.due_on),
      do: Money.mult(invoice.total, 0.02),
      else: Money.zero()
  end
end

# shell: effects stay at the edge, thin and obvious
def apply_late_fee(id) do
  inv = Repo.get!(Invoice, id)
  fee = Billing.Core.late_fee(inv, Date.utc_today())
  Repo.update!(change(inv, fee: fee))
end
'''
bad = '''
def late_fee(id) do
  invoice = Repo.get!(Invoice, id)   # I/O inside logic
  today = Date.utc_today()           # hidden clock

  if Date.after?(today, invoice.due_on) do
    fee = Money.mult(invoice.total, 0.02)
    Repo.update!(change(invoice, fee: fee))
    Logger.info("fee applied")   # effect mid-decision
  end
end
# testing the 2% rule now requires a database and today's
# date to cooperate
'''

[examples.go]
good = '''
// pure core: decidable and testable with no infrastructure
func Overdue(now time.Time, all []Invoice) []Invoice {
	return slices.DeleteFunc(slices.Clone(all),
		func(i Invoice) bool { return !now.After(i.DueDate) })
}

// thin shell: effects in, decision, effects out
func (s *Service) SendReminders(ctx context.Context) error {
	invs, err := s.repo.OpenInvoices(ctx)
	if err != nil {
		return fmt.Errorf("load invoices: %w", err)
	}
	return s.mail.Remind(ctx, Overdue(s.now(), invs))
}
'''
bad = '''
func (s *Service) SendReminders(ctx context.Context) error {
	rows, err := s.db.QueryContext(ctx, `SELECT id, due FROM inv`)
	if err != nil {
		return err
	}
	for rows.Next() {
		var inv Invoice
		rows.Scan(&inv.ID, &inv.DueDate)
		// the rule is wedged between two effects: untestable
		// without a real database, an SMTP server, and midnight
		if time.Now().After(inv.DueDate.Add(720 * time.Hour)) {
			s.smtp.Send(ctx, inv.ID)
		}
	}
	return rows.Err()
}
'''

[examples.java]
good = '''
// pure core: the decision needs no clock, db, or mailer
static Money lateFee(Invoice invoice, LocalDate today) {
    return today.isAfter(invoice.dueDate())
        ? invoice.total().percent(5)
        : Money.ZERO;
}

// thin shell owns every effect
void applyLateFees() {
    var today = LocalDate.now(clock);
    repository.overdue(today).forEach(inv ->
        repository.save(inv.plus(lateFee(inv, today))));
}
'''
bad = '''
Money lateFee(long invoiceId) throws SQLException {
    var invoice = jdbc.queryForObject(      // db inside rule
        "select * from invoices where id=?",
        invoiceMapper, invoiceId);
    if (LocalDate.now()                     // hidden wall clock
            .isAfter(invoice.dueDate())) {
        mailer.send(invoice.customerEmail(),// side effect fired
            "Late fee applied");            // from a "getter"
        return invoice.total().percent(5);
    }
    return Money.ZERO;
}
'''

[examples.kotlin]
good = '''
// core: pure decision, tested with plain values
fun nextRetryAt(attempt: Int, now: Instant): Instant =
    now.plusSeconds(1L shl attempt.coerceAtMost(6))

// shell: effects only, no decisions
suspend fun scheduleRetry(job: Job) {
    val at = nextRetryAt(job.attempt, clock.instant())
    queue.enqueue(job, at)
}
'''
bad = '''
suspend fun scheduleRetry(job: Job) {
    // the backoff decision is buried among DB, clock, and
    // queue effects — untestable without all three running
    val row = db.query("SELECT attempt FROM jobs WHERE id=?")
    val delay = 1L shl row.attempt.coerceAtMost(6)
    queue.enqueue(job, Instant.now().plusSeconds(delay))
    db.execute("UPDATE jobs SET attempt = attempt + 1")
}
'''

[examples.python]
good = '''
def overdue(invoices: list[Invoice],
            today: date) -> list[Invoice]:
    # pure decision: no clock, no database, trivial to test
    return [i for i in invoices
            if i.due < today and not i.paid]

def send_reminders(repo: InvoiceRepo, mail: Mailer) -> None:
    # thin shell owns the effects
    for invoice in overdue(repo.all(), date.today()):
        mail.remind(invoice)
'''
bad = '''
def overdue_invoices() -> list[Invoice]:
    conn = psycopg.connect(DSN)   # I/O buried in the rule
    rows = conn.execute(
        "select id, due, paid from invoices").fetchall()
    today = date.today()          # hidden clock dependency
    return [Invoice(*r) for r in rows
            if r[1] < today and not r[2]]
    # testing the date rule now needs a live database
'''

