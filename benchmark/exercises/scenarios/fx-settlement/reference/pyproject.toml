[project]
name = "fxsettle"
version = "0.1.0"
description = "Cross-currency invoice settlement."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fxsettle"]

[tool.pytest.ini_options]
python_files = ["*_spec.py"]
python_classes = ["Describe*"]
python_functions = ["should_*"]
