'''
bad = '''
tests/
  E2E/    # 1,400 Selenium tests — the only layer

# every rule, edge case, and validation message is
# exercised through login plus twelve page loads;
# the suite takes 4h20m, flakes daily, and a tax-
# rounding defect needs a browser to reproduce
'''

[examples.elixir]
good = '''
# pricing rules: fast core tests, one per rule, ms each
test "premium discount is 8%" do
  assert Pricing.discount(:premium, 100) == 8
end

# the risk that needs realism gets its own layer:
@tag :integration
test "checkout persists a priced order via the repo" do
  cart = build(:cart, tier: :premium, total: 100)
  {:ok, order} = Checkout.run(cart)
  assert Repo.get!(Order, order.id).total == 92
end
'''
bad = '''
# every pricing rule priced through the full stack,
# ~40s per case — one layer stretched over every risk
@tag :browser
test "premium discount is 8%" do
  {:ok, session} = Wallaby.start_session()

  session
  |> visit("/signup")
  |> fill_in_all_forms()
  |> create_order(total: 100)
  |> assert_text("Total: $92.00")
  # 30 more rules queued behind this same browser
end
'''

[examples.go]
good = '''
// fast core test for the decision itself: milliseconds, no I/O
func TestVolumeDiscountAppliesAt100Units(t *testing.T) {
	got := Price(order(100, unit(200)))
	if got != 18000 {
		t.Fatalf("want 10%% discount, got %d", got)
	}
}

// one integration test where the distinct risk lives: the SQL
// mapping (build-tagged, run in CI against real postgres)
func TestOrderRepoRoundTrip(t *testing.T) {
	db := startPostgres(t)
	requireRoundTrip(t, NewOrderRepo(db), sampleOrder())
}
'''
bad = '''
// one style stretched over every risk: each pricing rule
// boots the world, so the suite takes 40 minutes and flakes
func TestVolumeDiscount(t *testing.T) {
	db := startPostgres(t)
	api := startAPIServer(t, db)
	browser := startHeadlessChrome(t, api.URL)

	loginAs(t, browser, "buyer@example.com")
	addToCart(t, browser, "sku-1", 100)
	assertCheckoutShows(t, browser, "$180.00")
}
'''

[examples.java]
good = '''
src/test/java   (unit, ~2 s) — pricing, refund, tax rules
    runs on every save; no containers, no network
src/it/java     (integration) — OrderGateway vs Postgres
    covers SQL, mapping, and transaction boundaries only
src/contract    — provider contract for /api/v2/orders
    pins the JSON shape the mobile clients depend on

# each layer names the risk it covers; none re-proves
# what a cheaper layer already demonstrates
'''
bad = '''
// every rule tested end-to-end: HTTP + real DB + queue
@SpringBootTest(webEnvironment = RANDOM_PORT)
class AllBehaviorTest {  // 40 min, flaky on queue timing

    @Test
    void vatRoundsHalfUp() {    // a pure function, tested
        var response = rest.postForEntity(  // through the
            "/api/checkout", cartJson(), String.class);
        assertThat(response.getBody()).contains("10.05");
    }
    // 312 more rules queued behind the same slow harness
}
'''

[examples.kotlin]
good = '''
// fast core test: the pricing decision, no infrastructure
@Test fun `100 units prices at tier 2`() {
    assertThat(price(order(units = 100))).isEqualTo(TIER_2)
}

// one contract test where the wire shape is the real risk
@Test fun `gateway parses a declined charge`() =
    assertThat(gateway.parse(declinedJson))
        .isEqualTo(Charge.Declined("card_declined"))
// plus a single HTTP smoke test for end-to-end wiring
'''
bad = '''
// every pricing rule tested through full HTTP + Postgres
@Test fun `tier 1`() = fullStack { post("/orders", tiny) }
@Test fun `tier 2`() = fullStack { post("/orders", medium) }
@Test fun `tier 3`() = fullStack { post("/orders", large) }
@Test fun `rounding`() = fullStack { post("/orders", odd) }
// forty minutes, flaky containers, and when tier 2 breaks
// the failure points at an HTTP 500, not the pricing rule
'''

[examples.python]
good = '''
def test_gold_tier_gets_ten_percent():   # fast core check
    assert discount(tier="gold") == Decimal("0.10")

@pytest.mark.integration                 # real-boundary risk
def test_orders_survive_postgres_round_trip():
    repo = PgOrderRepo(pg_url)
    repo.save(order := an_order())
    assert repo.get(order.id) == order

@pytest.mark.system                      # one journey, not 40
def test_checkout_happy_path_end_to_end(): ...
'''
bad = '''
@pytest.mark.parametrize("tier", ALL_TIERS)   # 40 variants
def test_discount_via_full_stack(tier, live_server, browser):
    # every pricing rule driven through browser + database
    # + payment sandbox: ~6 min each, flaky, and a tier bug
    # takes an afternoon to localize
    browser.get(f"{live_server}/checkout?tier={tier}")
    browser.find("#pay").click()
    assert "10%" in browser.find("#summary").text
'''

