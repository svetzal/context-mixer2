id = "guidelines.intent.use-purpose-specific-test-layers"
title = "Use purpose-specific test layers"
category = "testing"
tags = ["test-strategy", "test-pyramid", "risk-based-testing"]
status = "hypothesized"
confidence = 0.96
capability = "The test suite provides fast local feedback and credible evidence across real system boundaries."
threat = "One test style is stretched across every risk, producing either slow fragile feedback or unrealistic isolation."
expectation = "Different defects require evidence at different scopes, from pure decisions to external integration."
strategy = "Use fast focused tests for core behavior and add integration, contract, system, or property tests where their distinct evidence is needed."
evidence = [{ type = "test_strategy_review", description = "Each test layer has a stated risk to cover and avoids duplicating evidence already provided more cheaply elsewhere.", required = true }]
tradeoff = "Multiple layers require separate fixtures, tooling, and decisions about where each behavior belongs."
scope = { project = "guidelines", paths = ["plugins/elixir-ecosystem/agents/elixir-craftsperson.md", "plugins/jvm-ecosystem/agents/java-craftsperson.md", "plugins/rust-ecosystem/agents/rust-craftsperson.md", "plugins/typescript-ecosystem/agents/typescript-bun-cli-craftsperson.md"] }
sources = [{ type = "document", ref = "plugins/elixir-ecosystem/agents/elixir-craftsperson.md#quality-assurance-process", summary = "Uses purpose-specific test layers rather than one undifferentiated suite.", confidence = 1.0 }, { type = "document", ref = "plugins/jvm-ecosystem/agents/java-craftsperson.md#testing-philosophy", summary = "Separates unit, integration, contract, and higher-level evidence.", confidence = 1.0 }, { type = "document", ref = "plugins/rust-ecosystem/agents/rust-craftsperson.md#testing-strategy", summary = "Uses purpose-specific Rust test layers based on risk.", confidence = 1.0 }]

# --- code examples (rendered by the intent atlas; managed by site/merge_examples.py) ---

[examples.clojure]
good = '''
;; fast core tests (hundreds, milliseconds): the decisions
(deftest bulk-discount-applies-at-ten-units
  (is (= 90.0 (line-total {:price 10.0 :qty 10}))))

;; one contract test per boundary — the risk units can't see:
(deftest ^:integration orders-roundtrip-through-postgres
  (with-tmp-db [db]
    (save-order db sample-order)
    (is (= sample-order (load-order db (:id sample-order))))))

;; plus one system smoke over real HTTP for wiring
'''
bad = '''
;; every pricing rule tested by booting the whole stack:
(deftest bulk-discount-applies-at-ten-units
  (with-system [sys (start-full-system!)]   ; ~40s per test
    (let [resp (http/post (str (:url sys) "/checkout")
                          {:body (json/write-str
                                  ten-unit-cart)})]
      (is (= 90.0 (-> resp :body parse-body :total))))))
; 300 rules x full HTTP + Postgres boot = a suite nobody
; runs locally; a one-line discount bug takes an hour to find
'''

[examples.cpp]
good = '''
tests/
  unit/pricing_test.cpp      # core rules; ms-fast, no I/O
  contract/crm_contract.cpp  # our gateway vs recorded CRM API
  integration/store_it.cpp   # real Postgres in a container
  system/checkout_smoke.cpp  # one end-to-end happy path

# Each layer's README names the risk it uniquely covers;
# pricing rules are NOT re-proven at system level, and the
# smoke test doesn't re-check rounding.
'''
bad = '''
tests/
  e2e/        # 412 Selenium tests, 96 minutes, flaky

# Every rule — rounding, VAT, coupon stacking — is asserted
# only by driving the full UI against a shared staging DB.
# A one-line pricing change reruns the world and fails
# randomly on login timeouts; developers stopped running
# the suite locally in March.
'''

[examples.csharp]
good = '''
tests/
  Domain.Tests/         # pure core rules, ms-fast
  Api.ContractTests/    # gateway contracts, WireMock
  App.IntegrationTests/ # real Postgres, Testcontainers
  Smoke/                # 3 end-to-end journeys

