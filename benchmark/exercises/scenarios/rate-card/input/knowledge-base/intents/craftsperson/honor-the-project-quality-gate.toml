Report: "All checks pass."
'''

[examples.rust]
good = '''
$ grep -A2 '^check:' Makefile
check:
	cargo fmt --all --check
	cargo clippy --workspace -- -D warnings && cargo test

$ make check
...                        # all three stages pass

Report: the project's own gate (`make check`) is green.
'''
bad = '''
$ make check
error: clippy: `unwrap` may panic (2 warnings)
test orders::rounds_half_up ... FAILED

$ cargo test my_new_module   # convenient subset instead
test result: ok. 4 passed

Report: "Done — tests pass."  # the shared gate never ran
'''

[examples.swift]
good = '''
