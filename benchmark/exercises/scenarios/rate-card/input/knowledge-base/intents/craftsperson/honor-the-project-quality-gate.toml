[examples.typescript]
good = '''
$ jq -r .scripts.verify package.json
tsc --noEmit && eslint . && vitest run && knip

$ npm run verify
tsc: clean   eslint: clean   vitest: 214 passed   knip: clean

Report: full project gate run as defined. knip required a
