[examples.typescript]
good = '''
// The finding is resolved by fixing what it pointed at.
const user = users.find((u) => u.id === id);
if (!user) throw new UserNotFoundError(id);
return user.email; // no non-null assertion needed

// The one remaining suppression is narrow and explained:
// eslint-disable-next-line no-await-in-loop -- migration
// steps are sequential by design; see #341
'''
bad = '''
/* eslint-disable */
// 47 warnings silenced file-wide to quiet the build; the
// same commit adds @ts-nocheck to three neighbours.
const user = users.find((u) => u.id === id)!;
return (user as any).email;

// Tomorrow's genuine defect will surface as warning #48 —
// invisible in a file nobody reads warnings from anymore.
'''
