[examples.ruby]
good = '''
# rubocop flagged Lint/UselessAssignment — fixed, not silenced
def summary(orders:)
  total = orders.sum(&:cents) # now actually used below
  format("%d orders, %d cents", orders.size, total)
end

# the one suppression is narrow and carries its rationale:
# rubocop:disable Metrics/MethodLength -- state machine table;
# splitting it hides the transition matrix (see #341)
'''
bad = '''
# .rubocop.yml
# AllCops:
#   DisabledByDefault: true  # 300 warnings? disable the tool

def summary(orders:)
  total = orders.sum(&:cents) # flagged unused for 8 months
  fromat("%d orders", orders.size) # typo hiding in the noise
end
'''

