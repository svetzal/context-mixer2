[examples.java]
good = '''
// finding fixed at the source, not silenced:
// [NullAway] discounts.forCustomer(id) may be empty
var discount = discounts.forCustomer(id)
    .orElse(Discount.NONE);

// the one remaining suppression is narrow and justified
@SuppressWarnings("resource") // socket is owned and closed
Socket lease() {              // by Pool — PoolLifecycleTest
    return pool.acquire();    // proves release on all paths
}
'''
bad = '''
@SuppressWarnings("all")  // blanket mute, whole class
class PaymentProcessor {
    void process(Order o) throws Exception {
        // 61 findings hidden below: unclosed streams,
        // unchecked casts, dead branches
        var in = new FileInputStream("/tmp/batch");
        List<Payment> p = (List) legacy.load(in);
        if (false) audit(p);
    }
}
// the next real defect's warning is muted before it fires
'''

[examples.kotlin]
good = '''
// detekt: MagicNumber -> resolved by naming the rule
private const val MAX_LOGIN_ATTEMPTS = 5

// the one suppression is narrow and carries its reason
@Suppress("TooGenericExceptionCaught") // JNI layer throws
// undeclared RuntimeExceptions; a narrow catch would crash
// the render loop. Tracked in ISSUE-482.
fun renderFrame(scene: Scene) = native.render(scene)
'''
bad = '''
@Suppress("all") // silence the linter wholesale
class LoginService {
    fun check(user: String, pass: String): Boolean {
        if (attempts > 5) lock(user) // finding hidden
        return verify(user, pass)
    }
}
// the detekt baseline grew by 40 findings this quarter;
// new warnings drown in old noise and nobody reads them
'''

