id = "guidelines.intent.resolve-static-analysis-findings"
title = "Resolve static-analysis findings"
category = "quality"
tags = ["static-analysis", "warnings", "automation"]
status = "hypothesized"
confidence = 0.98
capability = "Cheap mechanically detectable defects and policy violations are removed before delivery."
threat = "Warnings accumulate until they hide new defects and normalize bypassing automated feedback."
expectation = "Compilers, linters, and analyzers will detect classes of defects more consistently than manual review."
strategy = "Run the project's configured static analysis, resolve every finding, and document only narrow justified suppressions."
evidence = [{ type = "analysis_gate", description = "Configured analyzers complete without unaddressed findings and each suppression carries a specific rationale.", required = true }]
tradeoff = "Strict analysis can produce false positives and consume time on low-risk style findings."
scope = { project = "guidelines", paths = ["plugins/clojure-ecosystem/agents/clojure-craftsperson.md", "plugins/go-ecosystem/agents/go-craftsperson.md", "plugins/jvm-ecosystem/agents/kotlin-craftsperson.md", "plugins/typescript-ecosystem/agents/typescript-craftsperson.md"] }
sources = [{ type = "document", ref = "plugins/clojure-ecosystem/agents/clojure-craftsperson.md#quality-gates-mandatory", summary = "Makes static analysis a zero-warning completion gate.", confidence = 1.0 }, { type = "document", ref = "plugins/go-ecosystem/agents/go-craftsperson.md#quality-assurance", summary = "Requires an aggregate warning-free analysis gate and explained suppressions.", confidence = 1.0 }, { type = "document", ref = "plugins/jvm-ecosystem/agents/kotlin-craftsperson.md#mandatory-quality-gates", summary = "Resolves static-analysis warnings and audits exceptions before completion.", confidence = 1.0 }]

# --- code examples (rendered by the intent atlas; managed by site/merge_examples.py) ---

[examples.clojure]
good = '''
;; clj-kondo: 0 warnings, 0 errors across src and test

;; the one suppression — narrow, with a specific rationale:
#_{:clj-kondo/ignore [:deprecated-var]}
(legacy/checksum payload)
; the vendor requires their deprecated checksum until API v3
; ships; removal tracked in PAY-311
'''
bad = '''
;; .clj-kondo/config.edn
{:linters {:unused-binding     {:level :off}
           :deprecated-var    {:level :off}
           :unresolved-symbol {:level :off}
           :type-mismatch     {:level :off}}}

; 212 findings silenced wholesale in one commit so the build
; would go green; every future real defect of these kinds
; now arrives pre-hidden
'''

[examples.cpp]
good = '''
// clang-tidy flagged a real use-after-move — fixed:
auto session = std::move(pending);
registry.add(session);        // was: registry.add(pending)

// One narrow suppression, with its specific rationale:
// NOLINTNEXTLINE(cppcoreguidelines-pro-type-union-access)
// -- HW register map mandated by vendor errata #114
regs.ctrl.raw = 0x8001;

// $ clang-tidy -p build src/*.cpp  ->  0 warnings
'''
bad = '''
// NOLINTBEGIN  -- whole file, no rationale, since forever
auto session = std::move(pending);
registry.add(pending);    // real use-after-move, now buried
// NOLINTEND

# .gitlab-ci.yml
clang-tidy:
  allow_failure: true     # "temporary", added 2024
  # current count: 341 warnings (212 in March) — new defects
  # scroll past unread in a wall of normalized noise
'''

[examples.csharp]
good = '''
$ dotnet build -warnaserror
  0 Warning(s), 0 Error(s)

// the one suppression is narrow and explains itself
#pragma warning disable CA2000 // ownership moves to
var stream = OpenUpload();     // Response; framework
return Results.Stream(stream); // disposes it
#pragma warning restore CA2000
'''
bad = '''
App.csproj:
  <NoWarn>$(NoWarn);CS8600;CS8602;CS8604;
    CA2000;CA1062;CA2007;CS0618</NoWarn>
  <TreatWarningsAsErrors>false</TreatWarningsAsErrors>
<!-- 340 findings silenced repo-wide "to get CI
     green"; every new null-deref warning is now
     invisible along with the old ones -->
'''

[examples.elixir]
good = '''
$ mix credo --strict
  0 issues

