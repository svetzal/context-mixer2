[project]
name = "probefan"
version = "0.1.0"
description = "Concurrent service health probing."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/probefan"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = ["error"]
