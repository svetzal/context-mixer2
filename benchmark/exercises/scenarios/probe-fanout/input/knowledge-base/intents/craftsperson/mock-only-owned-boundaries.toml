[examples.clojure]
good = '''
(defprotocol PaymentGateway   ; owned boundary contract
  (charge! [this amount token]))

(defrecord FakeGateway [charges]   ; simple, readable fake
  PaymentGateway
  (charge! [_ amount token]
    (swap! charges conj {:amount amount :token token})
    {:status :approved}))

(deftest checkout-charges-exactly-once
  (let [gw (->FakeGateway (atom []))]
    (checkout gw (cart-with {:total 100}))
    (is (= 1 (count @(:charges gw))))))
'''
bad = '''
(deftest checkout-charges-exactly-once
  ; intercepts the Stripe library's internals — this test
  ; re-implements someone else's API and keeps passing while
  ; real integration behavior drifts
  (with-redefs [stripe.http/post-form
                (fn [_url _params] {"status" "succeeded"})]
    (checkout (cart-with {:total 100}))
    (is true)))
'''

[examples.cpp]
good = '''
// Owned contract, defined by this application:
struct RateSource {
  virtual ~RateSource() = default;
  virtual std::optional<Rate> rateFor(Currency) = 0;
};

class FakeRateSource : public RateSource {   // simple fake
public:
  std::optional<Rate> rateFor(Currency c) override {
    auto it = rates.find(c);
    return it == rates.end() ? std::nullopt
                             : std::optional{it->second};
  }
  std::map<Currency, Rate> rates;
};
'''
bad = '''
TEST(Rates, FetchesEurRate) {
  MockQNetworkAccessManager nam;   // Qt's internals, not ours
  EXPECT_CALL(nam, createRequest(
      QNetworkAccessManager::GetOperation, _, _))
      .WillOnce(Return(fakeReplyWithJson("{\"eur\":1.08}")));
  RateClient client(&nam);
  EXPECT_EQ(client.rateFor(Currency::EUR)->value, 1.08);
}
// re-implements Qt's HTTP plumbing; redirects, timeouts and
// encoding can all diverge in production while this passes
'''

[examples.csharp]
good = '''
// simple fake of the contract we own
public sealed class FakePayments : IPaymentGateway
{
    public List<Payment> Charged { get; } = [];
    public Task<PaymentResult> Charge(Payment p)
    { Charged.Add(p); return Task.FromResult(Ok); }
}

[Fact]
public async Task Checkout_charges_the_order_total()
{
    var payments = new FakePayments();
    await new Checkout(payments).Complete(Cart(120m));
    payments.Charged.Single().Cents.Should().Be(12000);
}
'''
