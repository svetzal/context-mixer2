[examples.elixir]
good = '''
# an application-owned contract at the boundary
defmodule App.WeatherPort do
  @callback forecast(city :: String.t()) ::
              {:ok, map()} | {:error, term()}
end

Mox.defmock(WeatherMock, for: App.WeatherPort)

test "advises an umbrella when rain is forecast" do
  expect(WeatherMock, :forecast, fn "YYZ" ->
    {:ok, %{rain: true}}
  end)

  assert Advice.for_city("YYZ") == :bring_umbrella
end
'''
bad = '''
test "advises an umbrella when rain is forecast" do
  # intercepts a third party's internals: this passes
  # even after real Req usage (headers, body shape)
  # has silently diverged in production
  :meck.new(Req, [:passthrough])

  :meck.expect(Req, :get!, fn _url, _opts ->
    %Req.Response{status: 200, body: %{"rain" => true}}
  end)

  assert Advice.for_city("YYZ") == :bring_umbrella
end
'''

[examples.go]
good = '''
// the app owns this contract; a simple fake shows behavior
type ObjectStore interface {
	Fetch(ctx context.Context, key string) ([]byte, error)
}

type fakeStore struct{ objects map[string][]byte }

func (f fakeStore) Fetch(_ context.Context, k string) ([]byte, error) {
	b, ok := f.objects[k]
	if !ok {
		return nil, ErrNotFound
	}
	return b, nil
}
'''
bad = '''
