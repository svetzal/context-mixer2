mockS3.On("GetObject", mock.Anything, &s3.GetObjectInput{
	Bucket: aws.String("assets"),
	Key:    aws.String("logo.png"),
}).Return(&s3.GetObjectOutput{Body: body}, nil)

svc := Thumbnailer{s3: mockS3}
// passes while real S3 pagination, retry, and error shapes
// diverge — this verifies our guess about AWS, not AWS
