[examples.java]
good = '''
// owned boundary contract, substituted by a simple fake
interface ExchangeRates {
    Rate usdToEur();
}

final class FixedRates implements ExchangeRates {
    public Rate usdToEur() { return new Rate("1.07"); }
}

@Test
void convertsUsingCurrentRate() {
    var converter = new Converter(new FixedRates());
    assertEquals(euros("107"), converter.toEur(dollars("100")));
}
'''
bad = '''
// mocks the JDK http client's own interface — duplicates
// someone else's contract, then trusts the duplicate
@Test
void fetchesRate() throws Exception {
    var client = mock(HttpClient.class);
    var response = mock(HttpResponse.class);
    when(response.body()).thenReturn("{\"rate\":1.07}");
    when(client.send(any(), any())).thenReturn(response);

    assertEquals(1.07, new RateService(client).usdToEur());
}
// passes even when real calls fail: auth, encoding,
// redirects, and the vendor's actual JSON all unexercised
'''

[examples.kotlin]
good = '''
interface Clock { fun now(): Instant }  // owned contract
class FixedClock(private val at: Instant) : Clock {
    override fun now() = at             // simple honest fake
}

@Test fun `trial expires after 14 days`() {
    val service = TrialService(FixedClock(day15))
    assertThat(service.isExpired(trialStartedOn(day1)))
        .isTrue()
}
'''
bad = '''
@Test fun `trial expires after 14 days`() {
    // intercepting a third-party client's internals —
    // re-implements OkHttp instead of an owned boundary
    mockkConstructor(OkHttpClient::class)
    val call = mockk<Call>()
    every { anyConstructed<OkHttpClient>().newCall(any()) }
        .returns(call)
    every { call.execute() } returns fakeTrialResponse()
    // passes even when real OkHttp behavior diverges
}
'''

[examples.python]
good = '''
class RateSource(Protocol):    # boundary contract we own
    def rate(self, base: str, quote: str) -> Decimal: ...

class FixedRates:              # simple fake of our contract
    def __init__(self, rates: dict[tuple[str, str], Decimal]):
        self._rates = rates
    def rate(self, base: str, quote: str) -> Decimal:
        return self._rates[(base, quote)]

def test_converts_using_current_rate():
    rates = FixedRates({("CAD", "USD"): Decimal("0.74")})
    money = convert(Money(100, "CAD"), "USD", rates)
    assert money == Money(74, "USD")
'''
bad = '''
@patch("httpx.Client.send")        # third-party internals
@patch("httpx.Response.json")
def test_convert(mock_json, mock_send):
    mock_send.return_value = Mock(status_code=200)
    mock_json.return_value = {"rates": {"USD": 0.74}}
    # re-implements httpx's call chain; stays green even
    # if the real API shape or our request is wrong
    money = convert(Money(100, "CAD"), "USD")
    assert money == Money(74, "USD")
'''

[examples.ruby]
good = '''
# Clock is our owned boundary contract; the fake implements
# it, not any library's internals
class FrozenClock
  def initialize(now:) = @now = now
  attr_reader :now
end

it "expires tokens after one hour" do
  t0 = Time.utc(2026, 1, 1)
  token = Token.new(clock: FrozenClock.new(now: t0), issued: t0)
  expect(token.expired?(at: t0 + 3601)).to be true
end
'''
bad = '''
it "expires tokens after one hour" do
  # stubs a third party's internals — mirrors their private
  # implementation; passes while real behavior diverges
  allow(Net::HTTP).to receive(:start)
    .and_return(double(body: '{"exp": 3600}'))
  allow(Time).to receive(:now).and_return(t0) # global patch

  expect(Token.fetch.expired?).to be false
end
'''

[examples.rust]
good = '''
// the boundary contract is ours; a fake states behavior
pub trait Mailer {
    fn send(&self, to: &Email, body: &str) -> Result<(), Err>;
}
#[derive(Default)]
struct FakeMailer { sent: RefCell<Vec<Email>> }
impl Mailer for FakeMailer {
    fn send(&self, to: &Email, _b: &str) -> Result<(), Err> {
        self.sent.borrow_mut().push(to.clone());
        Ok(())
    }
}
#[test]
fn welcome_mail_goes_to_the_new_user() { /* FakeMailer */ }
'''
bad = '''
// mocks the SMTP library's internals — the test now
// re-implements lettre's protocol and drifts from reality
#[test]
fn welcome_mail_sends() {
    let mut t = MockSmtpTransport::new();
    t.expect_connect().returning(|| Ok(Session::default()));
    t.expect_ehlo().times(1).returning(|_| Ok(()));
    t.expect_mail_from().returning(|_| Ok(()));
    t.expect_data()
        .withf(|b| b.starts_with(b"MIME-Version"))
        .returning(|_| Ok(()));
    signup(&mut t, "a@example.com").unwrap();
}
'''

[examples.swift]
good = '''
// The app owns this narrow contract; tests substitute the
// contract, never URLSession itself.
protocol RateFetching {
    func rate(for currency: Currency) async throws -> Decimal
}

struct FixedRates: RateFetching {
    var rates: [Currency: Decimal]
    func rate(for c: Currency) async throws -> Decimal {
        rates[c] ?? .zero
    }
}
'''
bad = '''
final class MockURLSession: URLSessionProtocol {
    var stubbedData: Data?
    var stubbedStatus = 200
    // re-implements Apple's semantics — redirects, caching,
    // cancellation — and quietly drifts from the real ones
    func data(for request: URLRequest) async throws
        -> (Data, URLResponse) {
        (stubbedData ?? Data(), fakeResponse(stubbedStatus))
    }
}
'''

[examples.typescript]
good = '''
// Owned contract at the boundary...
interface MailSender {
  send(to: string, body: string): Promise<void>;
}
// ...substituted with a simple, readable fake.
class FakeMailSender implements MailSender {
  sent: Array<{ to: string; body: string }> = [];
  async send(to: string, body: string): Promise<void> {
    this.sent.push({ to, body });
  }
}
it("mails a receipt after checkout", async () => {
  const mail = new FakeMailSender();
  await checkout(cart, mail);
  expect(mail.sent[0]?.to).toBe("kim@example.com");
});
'''
